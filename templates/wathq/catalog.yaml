# The Wathq catalog for the verify-data tab (التحقق من البيانات).
#
# One entry per endpoint the tab offers. Built from Wathq's own Swagger files
# (templates/wathq/<product>.yaml) and price list, by agents that read each
# spec and skeptics that re-checked them; then reviewed. wathq_catalog.py
# loads this strictly at boot and cross-checks every path and parameter
# against the spec, so a typo here fails the app instead of a paid call.
#
#   price     prepaid SAR per successful call (Wathq's price list)
#   lookup    a reference list (code tables), not data about one entity
#   language  sends ?language=ar|en
#   inputs    name/location exactly as Wathq spells them; kind picks the
#             validator (wathq_catalog.KINDS); personal = a person's ID —
#             never echoed back, logged or shown unmasked
#   one_of    at least one of these optional inputs is required
#   personal  response paths ([] = list item) masked before the browser sees them
#   redact    free-text response paths whose long digit runs are masked
#   labels    Arabic labels for fields the spec describes only in English

products:
- id: cr
  label: السجل التجاري
  label_en: Commercial Registration
  base: /commercial-registration
  sandbox_base: /sandbox/commercial-registration
  endpoints:
  - id: fullinfo
    path: /fullinfo/{id}
    label: البيانات الكاملة للسجل التجاري
    description: تُرجع كافة بيانات السجل التجاري من تواريخ وحالة ورأس مال وشركاء ومديرين ومصفين وأنشطة وبيانات اتصال
      وتجارة إلكترونية.
    price: 12
    lookup: false
    in_sandbox: true
    language: true
    inputs:
    - name: id
      location: path
      kind: company_number
      label: الرقم الوطني الموحد للسجل التجاري (700) أو رقم السجل التجاري
      required: true
      pattern: '[0-9]{10}'
      legacy_ok: true
    personal:
    - contactInfo.email
    - contactInfo.mobileNo
    - contactInfo.phoneNo
    - liquidators[].identity.id
    - management.managers[].identity.id
    - parties[].identity.id
    labels:
      entityType: نوع الكيان
      entityType.characters: صفات الشركة
      eCommerce.eStore: المتاجر الإلكترونية
      eCommerce.eStore[].storeActivities: أنشطة المتجر الإلكتروني
      parties[].identity: بيانات إثبات الشريك / المالك
