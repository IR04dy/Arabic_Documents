definitions:
  error:
    type: object
    required:
      - code
      - message
      - referenceid
    properties:
      code:
        type: string
      message:
        type: string
  fullInfo:
    type: object
    description: |-
      البيانات الأساسية للسجل التجاري
      Commercial Registry Information
      -
    properties:
      crNationalNumber:
        type: string
        description: Commercial Registry National Number - الرقم الموحد للسجل التجاري
      crNumber:
        type: string
        description: Commercial Registry Number - رقم السجل التجاري
      versionNo:
        type: integer
        description: Commercial Registry Version Number  - رقم نسخة السجل التجاري
      name:
        type: string
        description: Full Entity Name - الاسم التجاري للمنشأة
      nameLangId:
        type: integer
        description: Entity Name Language ID - رمز لغة الاسم التجاري
      nameLangDesc:
        type: string
        description: Entity Name Language Description - وصف لغة الاسم التجاري
      crCapital:
        type: number
        description: Capital - راس المال
      companyDuration:
        type: integer
        description: Company Duration - مدة الشركة
      isMain:
        type: boolean
        description: Is Main Commercial Registry - هل السجل التجاري رئيسي
      issueDateGregorian:
        type: string
        description: Commercial Registry Issue Date (Gregorian) - تاريخ اصدار السجل التجاري ميلادي
      issueDateHijri:
        type: string
        description: Commercial Registry Issue Date (Hijri) - تاريخ اصدار السجل التجاري هجري
      mainCrNationalNumber:
        type: string
        description: Main Commercial Registry National Number - الرقم الموحد للسجل الرئيسي
      mainCrNumber:
        type: string
        description: Main Commercial Registry Number - رقم السجل التجاري الرئيسي
      inLiquidationProcess:
        type: boolean
        description: In Liquidation Process - هل الشركة جاري تصفيتها
      hasEcommerce:
        type: boolean
        description: Has Ecommerce - هل تمارس التجارة الإلكترونية
      headquarterCityId:
        type: integer
        description: Headquarter City ID - رمز مدينة المقر الرئيسي للشركة
      headquarterCityName:
        type: string
        description: Headquarter City Name - وصف مدينة المقر الرئيسي للشركة
      isLicenseBased:
        type: boolean
        description: Is License-Based - هل السجل مصدر بناء على ترخيص
      licenseIssuerNationalNumber:
        type: string
        description: License Issuer National Number - الرقم الموحد لجهة إصدار الترخيص
      licenseIssuerName:
        type: string
        description: License Issuer Description - وصف جهة إصدار الترخيص
      partnersNationalityId:
        type: integer
        description: Partners Nationality ID - رمز جنسية الشركاء
      PartnersNationalityName:
        type: string
        description: Partners Nationality Description - وصف جنسية الشركاء
      entityType:
        type: object
        required:
          - id
          - name
        properties:
          id:
            type: integer
            description: Entity Type ID - رمز نوع الكيان
          name:
            type: string
            description: Entity Type Description - وصف نوع الكيان
          formId:
            type: integer
            description: Company Form ID - رمز شكل الشركة
          formName:
            type: string
            description: Company Form Description - وصف شكل الشركة
          characters:
            type: array
            items:
              type: object
              properties:
                id:
                  type: integer
                  description: Company Character ID - رمز صفة الشركة
                name:
                  type: string
                  description: Company Character Description - وصف صفة الشركة
              required:
                - id
                - name
      status:
        type: object
        description: 'حالة السجل التجاري - CR Status '
        required:
          - id
          - name
          - confirmationDate
        properties:
          id:
            type: integer
            description: CR Status ID - رمز حالة السجل التجاري
          name:
            type: string
            description: CR Status Description - وصف حالة السجل التجاري
          confirmationDate:
            type: object
            description: Commercial Registry Confirmation Date - تاريخ التأكيد السنوي للسجل التجاري
            required:
              - gregorian
              - hijri
            properties:
              gregorian:
                type: string
                description: Commercial Registry Confirmation Date (Gregorian) - تاريخ التأكيد السنوي للسجل التجاري ميلادي
              hijri:
                type: string
                description: Commercial Registry Confirmation Date (Hijri) - تاريخ التأكيد السنوي للسجل التجاري هجري
          reactivationDate:
            type: object
            description: Commercial Registry Reactivation Date - تاريخ رفع تعليق السجل التجاري
            properties:
              gregorian:
                type: string
                description: Commercial Registry Reactivation Date (Gregorian) - تاريخ رفع تعليق السجل التجاري ميلادي
              hijri:
                type: string
                description: Commercial Registry Reactivation Date (Hijri) - تاريخ رفع تعليق السجل التجاري هجري
            required:
              - gregorian
              - hijri
          suspensionDate:
            type: object
            description: Commercial Registry Suspension Date - تاريخ تعليق السجل التجاري
            properties:
              gregorian:
                type: string
                description: Commercial Registry Suspension Date (Gregorian) - تاريخ تعليق السجل التجاري ميلادي
              hijri:
                type: string
                description: Commercial Registry Suspension Date (Hijri) - تاريخ تعليق السجل التجاري هجري
            required:
              - gregorian
              - hijri
          deletionDate:
            type: object
            description: |
              Commercial Registry Delete Date - تاريخ شطب السجل التجاري
            properties:
              gregorian:
                type: string
                description: Commercial Registry Delete Date (Gregorian) - تاريخ شطب السجل التجاري ميلادي
              hijri:
                type: string
                description: Commercial Registry Delete Date (Hijri) - تاريخ شطب السجل التجاري هجري
            required:
              - gregorian
              - hijri
      contactInfo:
        type: object
        description: 'Contact Information  - بيانات الاتصال '
        properties:
          phoneNo:
            type: string
            description: Phone No - رقم الهاتف
          mobileNo:
            type: string
            description: Mobile No - رقم الجوال
          email:
            type: string
            description: Email - البريد الالكتروني
          websiteUrl:
            type: string
            description: Website URL - الموقع الالكتروني
      eCommerce:
        type: object
        description: |
          E-Commerce - بيانات التجارة الالكترونية
        properties:
          eStore:
            type: array
            items:
              type: object
              properties:
                authenticationPlatformUrl:
                  type: string
                  description: Authentication Platform URL - عنوان منصة التوثيق
                storeUrl:
                  type: string
                  description: Primary URL - عنوان الموقع الإلكتروني
                storeActivities:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Activity ID - رمز النشاط التجاري
                      name:
                        type: string
                        description: Activity Description - وصف النشاط التجاري
      capital:
        type: object
        description: 'Capital -  رأس المال '
        required:
          - currencyId
          - currencyName
        properties:
          currencyId:
            type: integer
            description: Capital Currency ID - رمز عملة رأس المال
          currencyName:
