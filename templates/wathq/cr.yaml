swagger: '2.0'
x-stoplight:
  id: bpqju3zndnukl
info:
  version: 6.14.0
  title: Wathq Commercial Registration API
host: api.wathq.sa
basePath: /commercial-registration
tags:
  - name: Commercial Registration
    description: ' '
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
  - application/xml
securityDefinitions:
  Authorization:
    type: apiKey
    name: apiKey
    in: header
paths:
  '/fullinfo/{id}':
    get:
      tags:
        - Commercial Registration
      summary: Retrieves all commercial registration data
      description: 'Retrieves all commercial registration data such as dates, status, activities, parties and others (refer to model) - الاستعلام عن كافة بيانات السجل التجاري'
      operationId: fullinfo
      produces:
        - application/json
        - application/xml
      parameters:
        - type: string
          name: id
          description: |
            Commercial Registration National Number - الرقم الوطني الموحد للسجل التجاري
                 **ملاحظة:** يتم البحث برقم السجل التجاري للسجلات التجارية المشطوبة فقط
          in: path
          required: true
        - type: string
          in: query
          name: language
          description: Commercial registration information language - لغة بيانات السجل التجاري
          enum:
            - ar
            - en
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/fullInfo'
          headers:
            THIQAH-API-ApiMsgRef:
              type: string
              format: uuid
              description: unique guid for each request
            THIQAH-API-ClientMsgRef:
              type: string
              format: uuid
              description: The original client reference value sent in the request
          examples:
            application/json:
              crNationalNumber: '7001272475'
              crNumber: '1010711252'
              versionNo: 1
              name: شركة اختبار للتجارة
              nameLangId: 1
              nameLangDesc: العربية
              crCapital: 150000
              companyDuration: 99
              isMain: false
              issueDateGregorian: '2002-10-05'
              issueDateHijri: '1423-07-28'
              mainCrNationalNumber: null
              mainCrNumber: null
              inLiquidationProcess: false
              hasEcommerce: true
              headquarterCityId: 1
              headquarterCityName: الرياض
              isLicenseBased: false
              licenseIssuerNationalNumber: '123456789'
              licenseIssuerName: xx
              partnersNationalityId: 1
              PartnersNationalityName: السعودية
              entityType:
                id: 1
                name: شركة
                formId: 1
                formName: ذات مسؤولية محدودة
                characters:
                  - id: 3
                    name: غير ربحية خاصة
              status:
                id: 1
                name: فعال
              confirmationDate:
                gregorian: '2003-10-05'
                hijri: '1424-07-28'
              reactivationDate:
                gregorian: '2023-03-10'
                hijri: '1444-08-18'
              suspensionDate:
                gregorian: '2022-12-05'
                hijri: '1444-04-11'
              deletionDate:
                gregorian: '2024-07-20'
                hijri: '1445-01-13'
