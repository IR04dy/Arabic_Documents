                phoneNo: '011256398'
                mobileNo: '050111101'
                email: TestEmail@mail.com
                websiteUrl: www.google.com
              eCommerce:
                eStore:
                  - authenticationPlatformUrl: www.google.com
                    storeUrl: www.google.com
                    storeActivities:
                      - id: '103062'
                        name: صناعة زبدة المكسرات
              capital:
                currencyId: 1
                currencyName: ريال سعودي
                contributionCapital:
                  typeId: 1
                  typeName: نقدي و عيني
                  cashCapital: 75000
                  inKindCapital: 75000
                  contributionValue: 100
                  totalCashContribution: 750
                  totalInKindContribution: 750
                stockCapital:
                  typeId: 1
                  typeName: xx
                  capital: 12000
                  announcedCapital: 1244
                  paidCapital: 12333
                  cashCapital: 1111
                  inKindCapital: 111
                  stocks:
                    - count: 11
                      value: 12
                      typeId: 1
                      typeName: xx
                      classReferenceID: 1
                      className: xx
              fiscalYear:
                isFirst: true
                calendarTypeId: 1
                calendarTypeName: ميلادي
                endMonth: 12
                endDay: 30
                endYear: null
              parties:
                - name: السيد عبدالعزيز احمد خالد الثنيان
                  typeId: 11
                  typeName: جمعية خيرية/ مؤسسة أهلية
                  identity:
                    id: '1101552388'
                    typeId: 1
                    typeName: هوية وطنية
                  partnership:
                    - id: 8
                      name: عضو
                  partnerShare:
                    cashContributionCount: 250
                    inKindContributionCount: 250
                    totalContributionCount: 500
                  nationality: null
                  licenseNo: null
                  crNumber: null
              management:
                structureId: 3
                structureName: مجلس مديرين
                managers:
                  - name: السيد عبدالعزيز احمد خالد الثنيان
                    typeId: 1
                    typeName: فرد سعودي
                    isLicensed: true
                    identity:
                      id: '1101552388'
                      typeId: 1
                      typeName: هوية وطنية
                    nationality:
                      id: 113
                      name: سعودي
                    positions:
                      - id: 8
                        name: عضو
              liquidators:
                - name: عبدالله سالم هليل الشمري
                  typeId: 1
                  typeName: فرد سعودي
                  identity:
                    id: '1101552234'
                    typeId: 1
                    typeName: هوية وطنية
                  nationality:
                    id: 113
                    name: سعودي
                  positions:
                    - id: 8
                      name: عضو
              activities:
                - id: '161090'
                  name: أنشطة أخرى خاصة بصناعة نشر الأخشاب
                - id: '162231'
                  name: صناعة السلالم والدرابزينات
        '400':
          $ref: '#/responses/ErrorResponse400'
        '401':
          $ref: '#/responses/ErrorResponse401'
        '404':
          $ref: '#/responses/ErrorResponse404'
        '500':
          $ref: '#/responses/ErrorResponse500'
        default:
          $ref: '#/responses/DefaultErrorResponse'
      security:
        - Authorization: []
