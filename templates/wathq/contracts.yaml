        '500':
          $ref: '#/responses/ErrorResponse500'
        default:
          $ref: '#/responses/DefaultErrorResponse'  
      security:
        - Authorization: []
  '/management/{crNationalNumber}':
    parameters:
      - type: string
        name: crNationalNumber
        in: path
        required: true
        description: Commercial Registration National Number - الرقم الوطني الموحد للسجل التجاري
      - type: string
        in: query
        enum:
          - ar
          - en
        name: language
        description: contract information language - لغة بيانات عقد الشركة
    get:
      tags:
       - Company Contract
      summary: 'retrieves all management info'
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/managementResponse'
          examples:
            application/json:
              structureId: 1
              structureName: مدير
              dismissalMethod: null
              managers:
                - name: فهد محمد معاذ خالد
                  typeId: 1
                  typeName: سعودى
                  isLicensed: false
                  identity:
                    id: '1132381599'
                    typeId: 1
                    typeName: هوية وطنية
                  nationality:
                    id: 113
                    name: السعودية
                  positions:
                    - id: 2
                      name: نائب رئيس مجلس مديرين
              managementBoard:
                meetingQuorumId: 1
                meetingQuorumName: كل المديرين
                canDelegateAttendance: true
                termYears: 0
                wayOfWork: string
                meetingPlace: string
                additionalText: string
                positions:
                  - id: 3
                    name: رئيس مجلس مديرين
              directorsBoard:
                memberCount: 0
                termYears: 0
                value: 0
                valueMax: 0
                wayOfWork: string
                meetingPlace: string
                meetingQuorum: 0
                meetingLegalQuorum: 0
                canDelegateAttendance: true
                boardCallMechanism: string
                membershipExpiryTerms: string
                additionalText: string
                rewards:
                  - id: string
                    name: string
                positions:
                  - id: 3
                    name: رئيس مجل مديرين
        '400':
          $ref: '#/responses/ErrorResponseManagement400'
        '401':
          $ref: '#/responses/ErrorResponse401'
        '404':
          $ref: '#/responses/ErrorResponse404'
        '500':
          $ref: '#/responses/ErrorResponse500'
        default:
          $ref: '#/responses/DefaultErrorResponse' 
      security:
        - Authorization: []
  '/manager/{crNationalNumber}/{id}/{idType}':
    parameters:
      - type: string
        name: crNationalNumber
        in: path
        required: true
        description: Commercial Registration National Number - الرقم الوطني الموحد للسجل التجاري
      - type: string
        name: id
        in: path
        required: true
        description: manger identification number - رقم هوية المدير
      - type: string
        enum:
        - National_ID
        - Resident_ID
        - Passport
        - GCC_ID
        - Endowment_Deed_No
        - License_No
        - CR_National_ID
        - Foreign_CR_No
        - National_Number
        - Boarder_Number
        - CR_Number
        - UndefinedD
        name: idType
        in: path
        required: true
        description: identification type - نوع الهوية
      - name: permissionId
        in: query
        description: permission role id  - رمز صلاحية المدير
        type: string
        minLength: 3
        maxLength: 4
      - type: string
        in: query
        name: language
        description: contract information language - لغة بيانات عقد الشركة
        enum:
          - ar
          - en
    get:
      tags:
       - Company Contract
      summary: retrieves manager info with permissions
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/managerResponse'
          examples:
            application/json:
              name: فهد محمد معاذ خالد
              typeId: 1
              typeName: سعودى
              isLicensed: false
              identity:
                id: '1132381599'
                typeId: 1
                typeName: هوية وطنية
              nationality:
                id: 113
                name: السعودية
              positions:
                - id: 2
                  name: نائب رئيس مجلس مديرين
              permissions:
                - id: 77442
                  name: قبول الرهن
                  canIssuePOA: true
                  canDelegate: true
                  specialConditionText: له كامل الصلاحيات
                  exerciseMethodId: 3
                  exerciseMethodDescription: منفرد
        '400':
          $ref: '#/responses/ErrorResponseManager400'
        '401':
          $ref: '#/responses/ErrorResponse401'
        '404':
          $ref: '#/responses/ErrorResponse404'
        '500':
          $ref: '#/responses/ErrorResponse500'
        default:
          $ref: '#/responses/DefaultErrorResponse'  
      operationId: ''
      description: ''
      security:
        - Authorization: []
  '/lookup/articleParts':
    get:
      summary: Retrieves all article parts lookups 
      description: 'Retrieves all article parts lookups - الاستعلام عن كافة أبواب البنود النصية   '
      tags: 
      - lookups
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/lookup'
          examples:
           application/json:
              id: 1
              nameAr: تأسيس الشركة
              nameEn: Establishment of the Company
        '401':
          $ref: '#/responses/ErrorResponse401'
        
        '404':
          $ref: '#/responses/ErrorResponse404'
       
        '500':
          $ref: '#/responses/ErrorResponse500'
        default:
          $ref: '#/responses/DefaultErrorResponse'
      security:
        - Authorization: []      
  '/lookup/partnerDecision':
    get:
      summary: Retrieves all partner decision lookups 
      description: 'Retrieves all partner decision lookups - الاستعلام عن كافة قرارات الشركاء '
      tags: 
      - lookups
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/lookup'
          examples:
           application/json:
              id: 10
              nameAr: تعديل بيانات السجل التجاري
              nameEn: Amending commercial register
        '401':
          $ref: '#/responses/ErrorResponse401'
        
        '404':
          $ref: '#/responses/ErrorResponse404'
       
        '500':
          $ref: '#/responses/ErrorResponse500'
        default:
          $ref: '#/responses/DefaultErrorResponse'
      security:
        - Authorization: []            
  '/lookup/exerciseMethod':
    get:
      summary: Retrieves all exercise method lookups
      description:  'Retrieves all exercise method lookups - الاستعلام عن كافة طرق ممارسة الصلاحيات  ' 
      tags: 
      - lookups
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/lookup'
          examples:
           application/json:
              id: 1
              nameAr: منفرد
              nameEn: Individual
        '401':
          $ref: '#/responses/ErrorResponse401'
        
        '404':
          $ref: '#/responses/ErrorResponse404'
       
        '500':
          $ref: '#/responses/ErrorResponse500'
        default:
          $ref: '#/responses/DefaultErrorResponse'
      security:
        - Authorization: []            
definitions:
  error:
    type: object
    required:
      - code
      - message
    properties:
      code:
        type: string
        minLength: 4
        maxLength: 10
      message:
        type: string
  infoSuccessResponse:
    type: object
    properties:
      contractCopyNumber:
        type: integer
        description: Contract Copy Number - رقم نسخة العقد
      contractDate:
        type: string
        description: Contract Date - تاريخ العقد
      entity:
        type: object
        required:
          - crNationalNumber
          - nameLangId
          - nameLangDesc
          - isLicenseBased
          - capital
          - parties
        properties:
          crNationalNumber:
            type: string
            description: CR National Number - الرقم الموحد للسجل التجاري
          crNumber:
            type: integer
            description: CR Number - رقم السجل التجاري
          name:
            type: string
            description: Entity Full Name (Arabic) - الاسم التجاري كامل باللغة العربية
          nameLangId:
            type: integer
            description: Entity Name Language ID - رمز لغة الاسم التجاري
          nameLangDesc:
            type: string
            description: Entity Name Language Description - وصف لغة الاسم التجاري
          companyDuration:
            type: integer
            description: Company Duration - مدة الشركة
          headquarterCityId:
            type: integer
            description: Headquarter City ID - رمز مدينة المقر الرئيس للشركة
          headquarterCityName:
            type: string
            description: Headquarter City Name - وصف مدينة المقر الرئيس للشركة
          isLicenseBased:
            type: boolean
            description: Is License Based - هل السجل مصدر بناء على ترخيص
          licenseIssuerNationalNo:
            type: string
            description: License Issuer National Number - الرقم الموحد لجهة إصدار الترخيص
          licenseIssuerName:
            type: string
            description: License Issuer Description - وصف جهة إصدار الترخيص
          entityType:
            type: object
            properties:
              id:
                type: integer
                description: Entity Type ID - رمز نوع الكيان
              name:
                type: string
                description: Entity Type Description - وصف نوع الكيان
              formId:
                type: integer
                description: Company Form ID - رمز شكل الشركة
              formName:
                type: string
                description: Company Form Description - وصف شكل الشركة
              characters:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Company Character ID - رمز صفة الشركة
                    name:
                      type: string
                      description: Company Character Description - وصف صفة الشركة
                  required:
                    - id
                    - name
            required:
              - id
              - name
              - formId
              - formName
          capital:
            type: object
            description: 'Capital -  رأس المال '
            required:
              - currencyId
              - currencyName
            properties:
              currencyId:
                type: integer
                description: Capital Currency ID - رمز عملة رأس المال
              currencyName:
                type: string
                description: Capital Currency Description - وصف عملة رأس المال
              contributionCapital:
                type: object
                description: Contribution Capital Details - بيانات رأس المال لمجموعة الحصص
                properties:
                  typeId:
                    type: integer
                    description: Capital Type ID - رمز نوع رأس المال
                  typeName:
                    type: string
                    description: Capital Type Description - وصف نوع رأس المال
                  cashCapital:
                    type: number
                    description: Cash Capital - رأس المال النقدي
                  inKindCapital:
                    type: number
                    description: In-kind Capital - رأس المال العيني
                  contributionValue:
                    type: number
                    description: Contribution Value - قيمة الحصة
                  totalCashContribution:
                    type: number
                    description: Total Cash Contribution - إجمالي عدد الحصص النقدية
                  totalInKindContribution:
                    type: number
                    description: Total In-kind Contribution - إجمالي عدد الحصص العينية
                required:
                  - typeId
                  - typeName
                  - contributionValue
                  - totalCashContribution
                  - totalInKindContribution
              stockCapital:
                type: object
                description: Stock Capital Details -  بيانات رأس المال لمجموعة الأسهم
                properties:
                  typeId:
                    type: integer
                    description: Capital Type ID - رمز نوع رأس المال
                  typeName:
                    type: string
                    description: Capital Type Description - وصف نوع رأس المال
                  cashCapital:
                    type: number
                    description: Cash Capital - رأس المال النقدي
                  inKindCapital:
                    type: number
                    description: In-kind Capital - رأس المال العيني
                  capital:
                    type: number
                    description: Capital - رأس المال المصدر
                  announcedCapital:
                    type: number
                    description: Announced Capital - رأس المال المصرح به
                  paidCapital:
                    type: number
                    description: Paid Capital - رأس المال المدفوع
                  stocks:
                    type: array
                    description: Stock List - قائمة الأسهم
                    items:
                      type: object
                      properties:
                        typeId:
                          type: integer
                          description: Stock Type ID - رمز نوع السهم
                        typeName:
                          type: string
                          description: Stock Type Description - وصف نوع السهم
                        count:
                          type: integer
                          description: Stock Count - عدد الأسهم
                        value:
                          type: number
                          description: Stock Value - قيمة السهم
                        classReferenceID:
                          type: integer
                          description: Stock Class Reference ID - رمز فئة السهم
                        className:
                          type: string
                          description: Stock Class Description - وصف فئة السهم
                      required:
                        - typeId
                        - typeName
                        - count
                        - value
                        - classReferenceID
                        - className
                required:
                  - typeId
                  - typeName
                  - capital
                  - paidCapital
          fiscalYear:
            type: object
            description: Fiscal Year - السنة المالية للمنشأة
            properties:
              isFirst:
                type: boolean
                description: Is First Fiscal Year - هل السنة المالية الأولى
              calendarTypeId:
                type: integer
                description: Calendar Type ID - رمز نوع التقويم
              calendarTypeName:
                type: string
                description: Calendar Type Description - وصف نوع التقويم
              endMonth:
                type: integer
                description: Fiscal Year End Month - شهر نهاية السنة المالية
              endDay:
                type: integer
                description: Fiscal Year End Day - يوم نهاية السنة المالية
              endYear:
                type: integer
                description: Fiscal Year End Year - سنة نهاية السنة المالية
            required:
              - isFirst
              - calendarTypeId
              - calendarTypeName
          parties:
            type: array
            description: 'parity List - قائمة الشركاء / مالك المؤسسة '
            items:
              type: object
              properties:
                name:
                  type: string
                  description: Name - الاسم
                typeId:
                  type: integer
                  description: Parity Type ID - رمز نوع الشريك
                typeName:
                  type: string
                  description: Parity Type Description - وصف نوع الشريك
                identity:
                  type: object
                  required:
                    - id
                    - typeId
                    - typeName
                  properties:
                    id:
                      type: string
                      description: Identifier No - رقم الإثبات
                    typeId:
                      type: integer
                      description: Identifier Type ID - رمز نوع الاثبات
                    typeName:
                      type: string
                      description: Identifier Type Description - وصف نوع الاثبات
                partnership:
                  type: array
                  description: partnership -   طبيعة الشراكة
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: Partnership Type ID - رمز طبيعة الشراكة
                      name:
                        type: string
                        description: Partnership Type Description - وصف طبيعة الشراكة
                    required:
                      - id
                      - name
                partnerShare:
                  type: object
                  description: 'partnerShare - قائمة حصص الشريك '
                  properties:
                    cashContributionCount:
                      type: integer
                      description: Cash Contribution Count - عدد الحصص النقدية
                    inKindContributionCount:
                      type: integer
                      description: In-kind Contribution Count - عدد الحصص العينية
                    totalContributionCount:
                      type: integer
                      description: Total Contribution Count - إجمالي عدد حصص الشريك
                partnerProfitLossDistribution:
                  type: object
                  description: 'Partner Profit Loss Distribution - نسب الربح والخسارة على الشركاء '
                  properties:
                    profitDistribution:
                      type: integer

                      description: 'Profit Percentage - النسبة من الأرباح '
                    lossDistribution:
                      type: integer
                     
                      description: Loss Percentage - النسبة من الخسائر
                  required:
                    - profitDistribution
                    - lossDistribution
                nationality:
                  type: object
                  description: Nationality - الجنسية
                  properties:
                    id:
                      type: integer
                      description: Nationality ID - رمز الجنسية
                    name:
                      type: string
                      description: Nationality Description - وصف الجنسية
                  required:
                    - id
                    - name
                crNumber:
                  type: string
                  description: Commercial Registry Number - رقم السجل التجاري
                licenseNo:
                  type: string
                  description: License No - رقم الترخيص
                guardian:
                  type: object
                 
                  description: Guardian Info - بيانات الوصي
                  properties:
                    name:
                      type: string
                     
                      description: 'name - الاسم '
                    identity:
                      type: object
                      
                      required:
                        - id
                        - typeId
                        - typeName
                      properties:
                        id:
                          type: string
                        
                          description: Identifier No - رقم الإثبات
                        typeId:
                          type: integer
                        
                          description: Identifier Type ID - رمز نوع الاثبات
                        typeName:
                          type: string
                         
                          description: Identifier Type Description - وصف نوع الاثبات
                    nationality:
                      type: object
                    
                      description: Nationality - الجنسية
                      required:
                        - id
                        - name
                      properties:
                        id:
                          type: integer
                         
                          description: Nationality ID - رمز الجنسية
                        name:
                          type: string
                         
                          description: Nationality Description - وصف الجنسية
                    isFatherGuardian:
                      type: boolean
                     
                      description: Is Father Guardian - هل الوصي هو الأب؟
                  required:
                    - name
                    - identity
                    - nationality
                    - isFatherGuardian
              required:
                - name
                - typeId
                - typeName
                - identity
          management:
            type: object
            description: Management Structure - نوع الهيكل الإداري  للمنشأة
            properties:
              structureId:
                type: integer
                description: Management Structure ID - رمز الهيكل الإداري
              structureName:
                type: string
                description: Management Structure Description - وصف الهيكل الإداري
              dismissalMethod:
                type: string
                description: Dismissal Method - طريقة العزل
              managers:
                type: array
                description: 'Manager List - قائمة المديرين '
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Name - الاسم
                    typeId:
                      type: integer
                      description: Manager Type ID - رمز نوع المدير
