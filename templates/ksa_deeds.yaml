        - {role: legatee, prefix: legatee, label_ar: الموصى له, repeatable: true, require: [name], section: الموصى لهم}
        - {role: executor, prefix: executor, label_ar: الوصي على تنفيذ الوصية, section: الوصي والناظر على الوصية}

  fields:
