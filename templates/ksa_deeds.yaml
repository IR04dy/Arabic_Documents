- id: sakk_rahn_aqari
  version: 1
  name_ar: صك رهن عقاري (سند رهن)
  name_en: Real-estate mortgage deed
  family: property
  description: >
    Pledges a parcel as security for a named debt: the راهن, the مرتهن (normally
    a bank, finance company or صندوق التنمية العقارية), the secured amount, the
    rank of the mortgage, and its registration.
  issuer_notes: >
    The Ministry of Justice routinely executes conveyance and mortgage as ONE
    transaction (إفراغ ورهن), so إفراغ / نقل ملكية / البائع / المشتري are NOT
    evidence against a mortgage. Where both a conveyance clause and a mortgage
    clause with درجة الرهن plus a secured amount are present, emit BOTH
    classifications as a composite instrument rather than forcing one winner.

  anchors:
