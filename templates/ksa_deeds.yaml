- id: aqd_nikah
  version: 1
  name_ar: عقد نكاح (وثيقة عقد زواج)
  name_en: Marriage contract
  family: family_status
  description: >
    The marriage documentation instrument executed by a مأذون أنكحة, recording
    the parties, the bride's ولي, the صداق, any agreed conditions, the offer and
    acceptance formula, and the witnesses.

  anchors:
    - {text: وثيقة عقد نكاح, weight: 3, group: title, voice: operative}
    - {text: وثيقة عقد زواج, weight: 3, group: title, voice: operative}
    - {text: مأذون أنكحة, weight: 3, group: officiant,
       note: "A مأذون line in the header is the sharpest single discriminator against إثبات زواج (a court instrument proving an unregistered marriage, which quotes the same offer-and-acceptance formula)."}
    - {text: عقد نكاح, weight: 2, group: title, voice: operative,
       not_preceded_by: [بموجب, رقم, تاريخ, بيانات], window: 25,
       note: "Gated because sakk_talaq prints بيانات عقد النكاح / رقم عقد النكاح in its own header."}
    - {text: زوجتك موليتي, weight: 3, group: formula, voice: operative}
    - {text: قبلت هذا النكاح, weight: 3, group: formula, voice: operative}
    - {text: على كتاب الله وسنة رسوله, weight: 2, group: formula}
    - {text: الصداق المعجل, weight: 2, group: dowry}
    - {text: الصداق المؤجل, weight: 2, group: dowry}
    - {text: ولي الزوجة, weight: 2, group: parties}

  negative_anchors:
    - {text: نوع الطلاق, reason: "Divorce-type line ⇒ talaq."}
    - {text: تاريخ وقوع الطلاق, reason: "Divorce-effect line ⇒ talaq."}
    - {text: بائن بينونة, reason: "Divorce classification ⇒ talaq."}
    - {text: انقضاء العدة, reason: "Post-divorce waiting period."}
    - {text: دعوى إثبات زواج, reason: "Court proof-of-marriage suit, not a مأذون contract."}
    - {text: المدعى عليها, reason: "Adversarial party label ⇒ a court ruling."}

  sections: [ترويسة الوثيقة وبياناتها, بيانات الزوج, بيانات الزوجة, بيانات ولي الزوجة,
             بيانات الوكيل, الصداق, الشروط المتفق عليها, صيغة العقد (الإيجاب والقبول),
             الشهود, التوثيق والتصديق]

  groups:
    - {use: deed_identity, require: [deed_date_hijri], section: ترويسة الوثيقة وبياناتها}
    - {use: legacy_register, section: ترويسة الوثيقة وبياناتها}
    - {use: attestation, require: [witness_name], section: التوثيق والتصديق}
    - {use: agency, section: بيانات الوكيل}
    - use: person_identity
      instances:
        - {role: husband, prefix: husband, label_ar: الزوج, require: [name], section: بيانات الزوج}
        - {role: wife, prefix: wife, label_ar: الزوجة, require: [name], section: بيانات الزوجة}
        - {role: bride_guardian, prefix: guardian, label_ar: ولي الزوجة, require: [name],
           section: بيانات ولي الزوجة,
           note: "The ولي is a PRINCIPAL PARTY here, not a guardian of a minor. Keyed apart from minor_guardianship.minor_guardian_name deliberately."}

  fields:
    - {key: dowry_amount, type: amount_sar, required: true, section: الصداق,
       label_ar: الصداق, label_en: Dowry,
       aliases_ar: [المهر, الصداق المعجل, مهر المثل]}
    - {key: dowry_deferred_amount, type: amount_sar, required: false, section: الصداق,
       label_ar: الصداق المؤجل, label_en: Deferred dowry,
       aliases_ar: [المهر المؤجل]}
    - {key: officiant_name, type: name, required: true, section: التوثيق والتصديق,
       label_ar: اسم المأذون, label_en: Officiant,
       aliases_ar: [المأذون, مأذون الأنكحة]}
    - {key: contract_formula, type: long_text, required: false, section: صيغة العقد (الإيجاب والقبول),
       label_ar: صيغة العقد, label_en: Offer and acceptance formula}
    - {key: agreed_conditions, type: long_text, required: false, repeatable: true, section: الشروط المتفق عليها,
       label_ar: الشروط المتفق عليها, label_en: Agreed conditions}
    - {key: guardianship_basis, type: enum, required: false, section: بيانات ولي الزوجة,
       label_ar: صفة الولي, label_en: Basis of the bride's guardianship,
       enum_values_ar: [أب, جد, أخ, عم, ابن, القاضي, ولي أمر]}

