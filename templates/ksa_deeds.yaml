- id: sakk_wasiyyah
  version: 1
  name_ar: صك وصية
  name_en: Will / testament deed
  family: estate
  description: >
    A bequest taking effect on death: the موصي, what is bequeathed, to whom, the
    executor, and the third-of-the-estate limit.
  issuer_notes: >
    ORTHOGRAPHY HAZARD. This template depends entirely on الموصى (legatee, alef
    maqsura) being distinguishable from الموصي (testator, yaa). The registry's
    normaliser has unify_alef_maqsura DISABLED for exactly this reason. If that
    setting is ever flipped on, every anchor in the `legatee` group below
    silently collapses into the `testator` group and this template stops working.

  anchors:
    - {text: صك وصية, weight: 3, group: title, voice: operative,
       not_preceded_by: [بموجب, رقم, استناداً إلى], window: 30}
    - {text: إثبات وصية, weight: 3, group: title, voice: operative}
    - {text: حجة وصية, weight: 2, group: title, voice: operative}
    - {text: لا وصية لوارث, weight: 3, group: doctrine, voice: operative}
    - {text: الموصى له, weight: 3, group: legatee}
    - {text: الموصى لهم, weight: 3, group: legatee}
    - {text: الموصى به, weight: 3, group: legatee}
    - {text: الموصي, weight: 2, group: testator}
    - {text: في حدود الثلث, weight: 2, group: third}
    - {text: ثلث مالي, weight: 2, group: third}
    - {text: الثلث الشرعي, weight: 2, group: third}
    - {text: إلا بإجازة الورثة, weight: 2, group: doctrine}
    - {text: بعد وفاتي, weight: 2, group: deferral, voice: operative}
    - {text: تنفذ بعد الوفاة, weight: 2, group: deferral, voice: operative}
    - {text: أوصيت, weight: 2, group: operative, voice: operative}
    - {text: الناظر على الوصية, weight: 2, group: executor}
    - {text: منفذ الوصية, weight: 2, group: executor}
    - {text: الرجوع عن الوصية, weight: 2, group: doctrine}
    - {text: بحال صحته وسلامة عقله, weight: 2, group: capacity}

  negative_anchors:
    - {text: المشمولين بالوصاية, reason: "Guardianship appointment (صك وصاية), which bequeaths nothing."}
    - {text: الولاية على مال القاصر, reason: "Same."}
    - {text: انحصر إرثه, reason: "Confinement clause ⇒ حصر ورثة."}
    - {text: ولا وارث له سواهم, reason: "Same."}
  # NOT a negative: القاصر / القصر — a will naming minor children as legatees
  # says exactly that.
  # REMOVED as negatives: صك وقف / حجة وقف / وقفية / الواقف / الناظر على الوقف.
  # A وصية بالوقف recites the full waqf formula; death-deferral decides instead.

  sections: [بيانات الصك والمحكمة, بيانات الموصي, نص الوصية, الموصى به, الموصى لهم,
             الوصي والناظر على الوصية, شروط الوصية وقيودها, الشهود, المصادقة والتوثيق]

  groups:
    - {use: deed_identity, require: [deed_number, deed_date_hijri, issuing_authority], section: بيانات الصك والمحكمة}
    - {use: legacy_register, section: بيانات الصك والمحكمة}
    - {use: property_description, section: الموصى به}
    - {use: source_deed, section: الموصى به}
    - {use: attestation, require: [witness_name], section: المصادقة والتوثيق}
    - {use: agency, section: بيانات الموصي}
    - {use: share, section: الموصى لهم}
    - {use: minor_guardianship, section: الموصى لهم}
