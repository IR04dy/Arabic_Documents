- id: sakk_talaq
  version: 1
  name_ar: صك طلاق (وثيقة إثبات طلاق)
  name_en: Divorce deed
  family: family_status
  description: >
    Documents a divorce that has already occurred: the parties, the underlying
    marriage contract, the type and date of the divorce, the waiting period, and
    any custody or maintenance arrangement.
  issuer_notes: >
    This instrument LEGITIMATELY reproduces the marriage contract's own data —
    رقم عقد النكاح، تاريخ عقد النكاح، المأذون — in its بيانات عقد النكاح block.
    Treating عقد نكاح or مأذون الأنكحة as negative evidence here is
    self-contradictory and was removed.

  anchors:
    - {text: صك إثبات طلاق, weight: 3, group: title, voice: operative}
    - {text: وثيقة إثبات طلاق, weight: 3, group: title, voice: operative}
    - {text: صك طلاق, weight: 3, group: title, voice: operative}
    - {text: حجة طلاق, weight: 2, group: title, voice: operative}
    - {text: نوع الطلاق, weight: 3, group: divorce_data,
       note: "The type line is the sharpest structural discriminator against aqd_nikah."}
    - {text: تاريخ وقوع الطلاق, weight: 3, group: divorce_data}
    - {text: بائن بينونة صغرى, weight: 2, group: divorce_type}
    - {text: بائن بينونة كبرى, weight: 2, group: divorce_type}
    - {text: طلقة رجعية, weight: 2, group: divorce_type}
    - {text: عدد الطلقات, weight: 2, group: divorce_data}
    - {text: أوقع الطلاق, weight: 2, group: operative, voice: operative}
    - {text: بيانات المطلقة, weight: 2, group: parties}

  negative_anchors:
    - {text: إثبات رجعة, reason: "Reversal instrument (صك رجعة)."}
    - {text: راجع مطلقته, reason: "Reversal in the operative voice."}
    - {text: بدل الخلع, reason: "Consideration paid by the wife ⇒ مخالعة."}
    - {text: فسخ عقد النكاح, reason: "Judicial dissolution ⇒ فسخ."}
    - {text: منطوق الحكم, reason: "Judgment structure ⇒ صك حكم, not this documentation instrument."}
    - {text: الأسباب والحيثيات, reason: "Same."}
  # REMOVED as negatives: عقد نكاح, مأذون الأنكحة, المهر المعجل, ولي أمر الزوجة —
  # this deed models all of them as its own fields.
  #
  # OPEN DECISION FOR THE REGISTRY OWNER: if divorce-by-court-ruling should also
  # route here, drop the last two negatives above. Currently unresolved.

  sections: [ترويسة الصك, بيانات الصك, بيانات المطلق, بيانات المطلقة, بيانات عقد النكاح,
             بيانات الطلاق, بيانات العدة, الحضانة والنفقة, الشهود, التصديق والتوقيع]

  groups:
    - {use: deed_identity, require: [deed_number, deed_date_hijri, issuing_authority], section: بيانات الصك}
    - {use: legacy_register, section: بيانات الصك}
    - {use: attestation, section: التصديق والتوقيع}
    - {use: agency, section: بيانات الصك}
    - {use: minor_guardianship, section: الحضانة والنفقة}
    - use: person_identity
      instances:
        - {role: divorcer, prefix: divorcer, label_ar: المطلق, require: [name], section: بيانات المطلق}
        - {role: divorcee, prefix: divorcee, label_ar: المطلقة, require: [name], section: بيانات المطلقة}

  fields:
    - {key: divorce_date_hijri, type: date_hijri, required: true, section: بيانات الطلاق,
       label_ar: تاريخ وقوع الطلاق, label_en: Date the divorce took effect}
    - {key: divorce_type, type: enum, required: false, section: بيانات الطلاق,
       label_ar: نوع الطلاق, label_en: Type of divorce,
       enum_values_ar: [رجعي, بائن بينونة صغرى, بائن بينونة كبرى, خلع, فسخ]}
    - {key: divorce_count, type: integer, required: false, section: بيانات الطلاق,
       label_ar: عدد الطلقات, label_en: Number of prior divorces,
       aliases_ar: [الطلقة الأولى, الطلقة الثانية, رقم الطلقة]}
    - {key: marriage_deed_number, type: deed_number, required: false, section: بيانات عقد النكاح,
       label_ar: رقم عقد النكاح, label_en: Underlying marriage contract number,
       classification_weight: 0}
    - {key: marriage_deed_date_hijri, type: date_hijri, required: false, section: بيانات عقد النكاح,
       label_ar: تاريخ عقد النكاح, label_en: Marriage contract date,
       classification_weight: 0}
    - {key: marriage_officiant, type: name, required: false, section: بيانات عقد النكاح,
       label_ar: المأذون, label_en: Officiant of the original marriage,
       aliases_ar: [مأذون الأنكحة], classification_weight: 0}
    - {key: iddah_status, type: text, required: false, section: بيانات العدة,
       label_ar: العدة, label_en: Waiting period}
    - {key: custody_arrangement, type: long_text, required: false, section: الحضانة والنفقة,
       label_ar: الحضانة, label_en: Custody arrangement}
    - {key: maintenance_amount, type: amount_sar, required: false, section: الحضانة والنفقة,
       label_ar: النفقة, label_en: Maintenance}

