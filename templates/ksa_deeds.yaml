- id: sakk_waqf
  version: 1
  name_ar: صك وقف (حجة وقف)
  name_en: Endowment (waqf) deed
  family: property
  description: >
    Creates a perpetual, inalienable endowment: the واقف, the endowed asset, the
    named beneficiaries or مصرف, the واقف's conditions, and the ناظر.
  issuer_notes: >
    Distinguished from sibling waqf-family documents (استبدال الوقف, تعيين ناظر,
    شهادة تسجيل وقف), which quote the same perpetuity formula inside their
    حيثيات and cite the original as بموجب صك الوقف رقم. Hence the gating below.

  anchors:
    - {text: لا يباع ولا يوهب ولا يورث, weight: 3, group: perpetuity, voice: operative,
       not_preceded_by: [بموجب, استناداً إلى, صادر بموجب, بناءً على], window: 40,
       note: "The perpetuity formula. Near-decisive, but ONLY in the creating voice."}
    - {text: وقفاً صحيحاً شرعياً مؤبداً, weight: 3, group: perpetuity, voice: operative,
       not_preceded_by: [بموجب, استناداً إلى, صادر بموجب], window: 40}
    - {text: صك وقف, weight: 2, group: title, voice: operative,
       not_preceded_by: [بموجب, رقم, استناداً إلى], window: 30}
    - {text: حجة وقف, weight: 2, group: title, voice: operative}
    - {text: إشهاد وقف, weight: 2, group: title, voice: operative}
    - {text: وقفية, weight: 2, group: title}
    - {text: الموقوف عليهم, weight: 3, group: beneficiary,
       note: "Beneficiaries of the USUFRUCT of an inalienable asset — cleanly separates waqf from hibah's الموهوب له, who takes ownership."}
    - {text: مصرف الوقف, weight: 2, group: beneficiary}
    - {text: العين الموقوفة, weight: 2, group: asset}
    - {text: ناظر الوقف, weight: 2, group: nazir}
    - {text: شروط الواقف, weight: 2, group: conditions}
    - {text: ريع الوقف, weight: 2, group: asset}
    - {text: لوجه الله تعالى, weight: 1, group: intent,
       note: "Pious-intent wording is shared with hibah. Weight 1 in both, permanently."}

  negative_anchors:
    - {text: بعد وفاتي, reason: "Death-deferral ⇒ وصية, even when the full waqf formula is recited (a وصية بالوقف)."}
    - {text: تنفذ بعد الوفاة, reason: "Same."}
    - {text: استبدال الوقف, reason: "Sibling waqf-family instrument."}
    - {text: تعيين ناظر, reason: "Sibling waqf-family instrument."}
    - {text: عزل الناظر, reason: "Sibling waqf-family instrument."}
  # REMOVED as negatives: صك وصية / الموصي / الموصى له. A وصية بالوقف genuinely
  # contains both vocabularies; the death-deferral rule above decides instead.

  sections: [الترويسة والديباجة, بيانات الصك, بيانات الواقف, العين الموقوفة وصيغة الوقف,
             جهة الوقف والموقوف عليهم, شروط الواقف, النظارة على الوقف,
             الإقرار والإشهاد والشهود, التصديق والختم]

  groups:
    - {use: deed_identity, require: [deed_date_hijri], section: بيانات الصك}
    - {use: legacy_register, section: بيانات الصك}
    - {use: property_description, section: العين الموقوفة وصيغة الوقف}
    - {use: boundaries, section: العين الموقوفة وصيغة الوقف}
    - {use: source_deed, section: العين الموقوفة وصيغة الوقف}
    - {use: attestation, section: التصديق والختم}
    - {use: agency, section: بيانات الواقف}
    - {use: share, section: جهة الوقف والموقوف عليهم}
    - use: person_identity
      instances:
        - {role: waqif, prefix: waqif, label_ar: الواقف, require: [name], section: بيانات الواقف}
        - {role: nazir, prefix: nazir, label_ar: ناظر الوقف, section: النظارة على الوقف}

  fields:
    - {key: waqf_declaration_text, type: long_text, required: true, section: العين الموقوفة وصيغة الوقف,
       label_ar: صيغة الوقف, label_en: Endowment formula}
    - {key: waqf_asset_description, type: long_text, required: true, section: العين الموقوفة وصيغة الوقف,
       label_ar: وصف العين الموقوفة, label_en: Description of the endowed asset}
    - {key: waqf_beneficiaries, type: long_text, required: true, section: جهة الوقف والموقوف عليهم,
       label_ar: الموقوف عليهم, label_en: Beneficiaries,
       aliases_ar: [مصرف الوقف, جهة الوقف]}
    - {key: waqf_type, type: enum, required: false, section: جهة الوقف والموقوف عليهم,
       label_ar: نوع الوقف, label_en: Type of endowment,
       enum_values_ar: [ذري, خيري, مشترك]}
    - {key: waqif_conditions, type: long_text, required: false, repeatable: true, section: شروط الواقف,
       label_ar: شروط الواقف, label_en: Conditions imposed by the endower}
    - {key: nazir_powers, type: long_text, required: false, section: النظارة على الوقف,
       label_ar: صلاحيات الناظر, label_en: Powers of the administrator}

# -----------------------------------------------------------------------------
- id: sakk_hibah
  version: 1
  name_ar: صك هبة
  name_en: Gift (hiba) deed
  family: property
  description: >
    Transfers ownership without consideration: the واهب, the موهوب له, the
    subject of the gift, the gift formula, and the acceptance and taking of
    possession.
  issuer_notes: >
    Route here ONLY on the operative gift act. An ordinary electronic title deed
    whose acquisition-cause block reads سبب التملك: هبة is a TITLE DEED — it
    recites how title was acquired, it does not perform the gift.

  anchors:
    - {text: وهب هبة شرعية منجزة نافذة, weight: 3, group: formula, voice: operative}
    - {text: هبة منجزة نافذة, weight: 3, group: formula, voice: operative}
    - {text: هبة شرعية منجزة, weight: 3, group: formula, voice: operative}
    - {text: إفراغ هبة, weight: 3, group: title, voice: operative,
       in_section: [الترويسة, بيانات الصك],
       note: "Only as a TITLE line. In a cause block it is neutral."}
    - {text: صك هبة, weight: 2, group: title, voice: operative,
       not_preceded_by: [بموجب, رقم, استناداً إلى], window: 30}
    - {text: وثيقة هبة, weight: 2, group: title, voice: operative}
    - {text: الموهوب له, weight: 3, group: parties,
       co_occurs_with: [الواهب], within: 120,
       note: "The donor/donee PAIR within ~120 chars is the reliable signal, not either word alone."}
    - {text: الموهوب لها, weight: 3, group: parties, co_occurs_with: [الواهب], within: 120}
    - {text: وقبل الموهوب له الهبة, weight: 3, group: acceptance, voice: operative}
    - {text: العين الموهوبة, weight: 2, group: asset}
    - {text: لوجه الله تعالى, weight: 1, group: intent,
       note: "Shared with waqf. Weight 1 in both, permanently."}
    - {text: سبب التملك هبة, weight: 0, group: cause,
       note: "ZERO. Acquisition-cause block on a title deed. Kept listed so nobody re-adds it with a weight."}
    - {text: نوع الإفراغ هبة, weight: 0, group: cause, note: "ZERO, same reason."}

  negative_anchors:
    - {text: بالثمن الحال والمقبوض, reason: "Stated consideration ⇒ sale."}
    - {text: بثمن قدره, reason: "Stated consideration ⇒ sale."}
    - {text: قبض البائع الثمن, reason: "Stated consideration ⇒ sale."}
    - {text: بيعاً شرعياً, reason: "Sale in the operative voice."}
    - {text: بعد وفاتي, reason: "Death-deferral ⇒ وصية, not a منجزة gift."}
    - {text: لا يباع ولا يوهب ولا يورث, reason: "Perpetuity formula ⇒ وقف. Present only in waqf."}
  # NOTE: the ABSENCE of an explicit no-consideration phrase proves nothing —
  # the word هبة already entails it, and إفراغ-generated electronic instruments
  # often print no such clause. That is why no_consideration_statement is
  # optional below, not required.

  sections: [الترويسة, بيانات الصك, بيانات الواهب, بيانات الموهوب له, بيانات العقار,
             حدود وأطوال العقار, صيغة الهبة والإقرارات, القبول والقبض,
             سند الملكية السابق, التوقيعات والتصديق]

  groups:
    - {use: deed_identity, require: [deed_number, deed_date_hijri, issuing_authority], section: بيانات الصك}
    - {use: legacy_register, section: بيانات الصك}
    - {use: property_description, section: بيانات العقار}
    - {use: boundaries, section: حدود وأطوال العقار}
    - {use: source_deed, section: سند الملكية السابق}
    - {use: attestation, section: التوقيعات والتصديق}
    - {use: agency, section: بيانات الواهب}
    - {use: share, section: بيانات العقار}
    - {use: minor_guardianship, section: بيانات الموهوب له}
    - use: person_identity
      instances:
        - {role: donor, prefix: donor, label_ar: الواهب, repeatable: true, require: [name], section: بيانات الواهب}
        - {role: donee, prefix: donee, label_ar: الموهوب له, repeatable: true, require: [name], section: بيانات الموهوب له}

  fields:
    - {key: gift_subject_description, type: long_text, required: true, section: صيغة الهبة والإقرارات,
       label_ar: الموهوب, label_en: Subject of the gift,
       aliases_ar: [العين الموهوبة, الموهوب به]}
    - {key: gift_declaration, type: long_text, required: true, section: صيغة الهبة والإقرارات,
       label_ar: صيغة الهبة, label_en: Gift formula}
    - {key: acceptance_statement, type: long_text, required: false, section: القبول والقبض,
       label_ar: القبول والقبض, label_en: Acceptance and taking of possession}
    - {key: donor_donee_relation, type: text, required: false, section: بيانات الموهوب له,
       label_ar: صلة القرابة, label_en: Relationship between donor and donee}
    - {key: no_consideration_statement, type: long_text, required: false, section: صيغة الهبة والإقرارات,
       label_ar: إقرار عدم المقابل, label_en: Statement of no consideration,
       aliases_ar: [بدون عوض, دون مقابل]}

