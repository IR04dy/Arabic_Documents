# =============================================================================
# 7. PAIRWISE DISAMBIGUATION
# =============================================================================
# Consulted when stage 2 leaves two templates within the review margin, and
# injected into the tier-3 LLM prompt as the deciding question.
disambiguation:

  - between: [sakk_milkiyyah_aqar, "*"]
    rule: >
      CROSS-CUTTING, resolves the registry's largest false-positive class. The
      property description block — رقم الصك، تاريخ الصك، بيانات العقار، نوع
      العقار، رقم المخطط، رقم القطعة، المساحة، الحدود والأطوال، الإحداثيات — is
      reproduced verbatim by every instrument that encumbers, gifts, endows,
      bequeaths or divides the parcel. It carries ZERO template weight. Decide
      on the operative clause alone.

  - between: [sakk_milkiyyah_aqar, sakk_hibah]
    rule: >
      Route to hibah only if the donor/donee pair co-occurs within ~120 chars,
      OR a gift formula appears in the performative voice, OR the title line
      reads إفراغ هبة. A deed whose cause block merely reads سبب التملك: هبة,
      carrying an owner table and a boundary grid, is a title deed.

  - between: [sakk_milkiyyah_aqar, sakk_qismah]
    rule: >
      المتقاسمون plus a per-partner allotment clause ⇒ qismah. A single owner
      table listing several owners على الشيوع, with no demarcated portion
      allotted to each, is a title deed. The word قسمة in the cause block must
      not reroute.

  - between: [sakk_milkiyyah_aqar, sakk_rahn_aqari]
    rule: >
      A secured amount bound to a named creditor is decisive for rahn (درجة
      الرهن, الدين المضمون بالرهن, a مرتهن that is a bank or finance company).
      Mortgage vocabulary inside a القيود والرهون annotation block on a deed
      that also has an owner table and an ownership clause is a
      mortgage-annotated TITLE deed.

  - between: [sakk_milkiyyah_aqar, sakk_waqf]
    rule: >
      The perpetuity formula in the creating voice plus a named مصرف or موقوف
      عليهم ⇒ waqf, regardless of how much property description it copies. A
      title deed requires a personal owner acquiring title.

  - between: [sakk_waqf, sakk_wasiyyah]
    rule: >
      WHEN does the dedication take effect. Deferral to death (بعد وفاتي,
      تنفذ بعد الوفاة) together with الموصى له or الموصى به or لا وصية لوارث ⇒
      wasiyyah, EVEN when the full waqf perpetuity formula is recited (a وصية
      بالوقف). Immediate dedication with a named ناظر and no death-deferral ⇒
      waqf.

  - between: [sakk_hibah, sakk_waqf]
    rule: >
      The beneficiary term separates them cleanly. الموهوب له takes OWNERSHIP;
      الموقوف عليهم take the USUFRUCT of an inalienable asset. Both may recite
      لوجه الله تعالى, so pious-intent wording stays weight 1 in both. The
      perpetuity formula is present only in waqf and is near-decisive.

  - between: [sakk_hibah, sale_or_conveyance]
    rule: >
      A stated consideration is decisive for sale (ثمن قدره, بالثمن الحال
      والمقبوض, قبض البائع الثمن, بيعاً شرعياً). The ABSENCE of a
      no-consideration phrase proves nothing — هبة already entails it.

  - between: [sakk_hasr_warathah, cited_by_other_instruments]
    rule: >
      THE most important rule in the registry, because this deed is cited more
      often than it is submitted. Require the confinement clause in the
      OPERATIVE voice, immediately governing a list of persons, NOT preceded
      within ~40 chars by بموجب صك حصر الورثة رقم or استناداً إلى. A heirs table
      alone is insufficient — قسمة التركة and الفريضة الشرعية carry an identical
      الاسم / صلة القرابة table.

  - between: [sakk_hasr_warathah, sakk_qismah]
    rule: >
      Enumeration without division ⇒ hasr_warathah. Division with demarcated
      allotments ⇒ qismah. Physical allotment vocabulary (وقع في نصيب, الحصة
      المفرزة, per-share boundaries, معدل القسمة) with the heirs named as
      partners routes to qismah even when the confinement clause is recited as
      background.

  - between: [sakk_wasiyyah, sakk_hasr_warathah]
    rule: >
      The legatee term decides: الموصى له / الموصى لهم / الموصى به / لا وصية
      لوارث ⇒ wasiyyah. The confinement clause plus an enumerated heirs block ⇒
      hasr_warathah. A testator's death date alone decides nothing — an إثبات
      وصية issued after death carries one and may cite the حصر ورثة number.
      DEPENDS on ى not folding to ي.

  - between: [sakk_wasiyyah, sakk_wisayah]
    rule: >
      Both use the root وص. A bequest requires الموصى به and/or الموصى له; a
      guardianship instrument speaks of القاصر, المشمولين بالوصاية, الولاية على
      مال القاصر and bequeaths nothing. Do NOT use القاصر as a negative on
      wasiyyah — a will naming minor children says exactly that.

  - between: [aqd_nikah, sakk_talaq]
    rule: >
      Offer-and-acceptance in the performative voice plus a مأذون أنكحة line ⇒
      nikah. A divorce type or effect line (نوع الطلاق, طلقة رجعية, بائن
      بينونة, تاريخ وقوع الطلاق) ⇒ talaq — even though a talaq deed legitimately
      prints رقم عقد النكاح and the original المأذون in its own header.

  - between: [aqd_nikah, sakk_ithbat_zawaj]
    rule: >
      Litigation vocabulary decides: دعوى إثبات زواج, المدعي, المدعى عليها,
      لائحة الدعوى plus the ABSENCE of a مأذون line ⇒ a court proof-of-marriage
      instrument, which may quote the very same offer-and-acceptance formula.

  - between: [sakk_talaq, sakk_rajaa_khula_faskh]
    rule: >
      Reversal in the operative voice (راجع مطلقته, إثبات رجعة) ⇒ رجعة. A
      consideration paid by the wife (بدل الخلع, مخالعة) ⇒ خلع. Judicial
      dissolution (فسخ عقد النكاح) ⇒ فسخ. Each narrates the underlying divorce
      in talaq's own words, which is why talaq's type line cannot be decisive on
      its own.

  - between: [wakalah_shariyyah, any_deed_executed_by_agent]
    rule: >
      A standalone wakalah has the agency data as its OWN header (رقم الوكالة,
      حالة الوكالة, نص الوكالة, حق توكيل الغير). An ordinary deed executed
      بالوكالة cites the PoA inside a party block and has its own subject
      matter. The bare tokens الموكل / الوكيل / وكالة شرعية are evidence for
      NOTHING.

  - between: [wakalah_shariyyah, tafwid_idari]
    rule: >
      المفوض له, قرار تفويض, تفويض صلاحيات ⇒ administrative delegation. The
      shared term الصلاحيات الممنوحة is why it sits at weight 1; the
      discriminator is the party label plus a wakalah status line.

  - between: [sakk_rahn_aqari, sakk_fak_rahn]
    rule: >
      Release in the operative voice (شطب قيد الرهن, تم فك الرهن عن العقار, سند
      فك رهن, خال من الرهون والقيود) ⇒ release. A release CONDITION inside the
      terms block (يفك الرهن عند سداد كامل الدين) is normal on a live mortgage.
      Match only the longer release-specific phrases, never the bare فك الرهن.

  - between: [sakk_rahn_aqari, sakk_ifragh_aqari]
    rule: >
      إفراغ ورهن is routinely ONE transaction, so conveyance vocabulary is not
      evidence against a mortgage. Where both a conveyance clause and a mortgage
      clause with a rank and secured amount appear, emit BOTH classifications as
      a composite instrument.

  - between: [sakk_qismah, qarar_farz_wahadat]
    rule: >
      Issuer decides. وزارة العدل / كتابة العدل with المتقاسمون ⇒ qismah.
      الأمانة or البلدية issuing قرار فرز وحدات عقارية with no named co-owners ⇒
      an administrative decision, out of this registry.

  - between: [sakk_hasr_warathah, shahadat_wafah]
    rule: >
      الأحوال المدنية issuing a death record with no enumerated heirs and no
      confinement clause ⇒ death certificate. hasr_warathah CITES the death
      certificate number as evidence, so شهادة الوفاة on the page is neutral.


# =============================================================================
# 8. OPEN ITEMS  (decide before this registry goes to production)
# =============================================================================
open_items:
  - id: composite_instruments
    question: "إفراغ ورهن is one transaction producing one document. Emit two template_ids, or add a composite template?"
    current_behaviour: "Emit both (see sakk_rahn_aqari disambiguation)."
    blocking: false

  - id: talaq_by_ruling
    question: "Should a court ruling dissolving a marriage route to sakk_talaq, or to a separate hukm template?"
    current_behaviour: "Excluded — منطوق الحكم and الأسباب والحيثيات are negatives on sakk_talaq."
    blocking: true

  - id: weight_calibration
    question: >
      Weights were authored per-template and are not yet comparable across the
      set. max_per_group scoring plus normalize_by max_possible_score is the
      first-order fix; the thresholds in classification.tiers still need to be
      fitted against a held-out labelled set rather than chosen by feel.
    blocking: true

  - id: bundles
    question: "One PDF holding a deed plus an ID copy plus an attachment. Per-page prediction then segment runs of the same template?"
    current_behaviour: "One document per file assumed."
    blocking: false

  - id: template_versioning
    question: "Ministry forms change. Two versions sharing field keys under one id, or separate ids?"
    current_behaviour: "version: 1 on every template; no migration path defined."
    blocking: false

  - id: legacy_deed_number_fallback
    question: "deed_number (6-15 digits) rejects legacy 1-5 digit serials. Loader must fall back to legacy_deed_number when legacy_register is populated — not yet implemented."
    blocking: true
