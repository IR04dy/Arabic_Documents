       aliases_ar: [صيغة الوصية]}
    - {key: bequeathed_item, type: long_text, required: true, repeatable: true, section: الموصى به,
       label_ar: الموصى به, label_en: Bequeathed item}
    - {key: third_limit_statement, type: long_text, required: false, section: شروط الوصية وقيودها,
