    - {id: directors_board_quorum, label_ar: "نصاب اجتماع مجلس الإدارة", prompt_ar: null, compare: number, source: {query: contracts.management, path: directorsBoard.meetingQuorum}}
    - {id: directors_board_can_delegate_attendance, label_ar: "جواز التوكيل بالحضور (مجلس الإدارة)", prompt_ar: null, compare: flag, source: {query: contracts.management, path: directorsBoard.canDelegateAttendance}}
    - {id: directors_board_meeting_place, label_ar: "مكان انعقاد جلسات المجلس (مجلس الإدارة)", prompt_ar: null, compare: text, source: {query: contracts.management, path: directorsBoard.meetingPlace}}
    - {id: directors_board_positions, label_ar: "مناصب مجلس الإدارة", prompt_ar: null, compare: list, source: {query: contracts.management, path: "directorsBoard.positions[].name"}}
    - {id: activities, label_ar: "وصف النشاط التجاري", prompt_ar: "الأنشطة", compare: list, source: {query: contracts.info, path: "entity.activities[].name"}, note_ar: "أغراض الشركة"}
    - {id: activity_codes, label_ar: "رمز النشاط التجاري", prompt_ar: "الأنشطة", compare: list, source: {query: contracts.info, path: "entity.activities[].id"}}
    - {id: notification_channels, label_ar: "وصف وسيلة الابلاغ", prompt_ar: null, compare: list, source: {query: contracts.info, path: "notificationChannel[].name"}, note_ar: "رسائل نصية، بريد إلكتروني، خطاب مسجل"}
    - {id: partner_decisions, label_ar: "وصف القرار (قرارات الشركاء)", prompt_ar: "قرارات الشركاء ونسبة اعتمادها", compare: list, source: {query: contracts.info, path: "partnerDecision[].name"}}
    - {id: decision_approval_percentages, label_ar: "النسبة اللازمة لاعتماد القرار", prompt_ar: "قرارات الشركاء ونسبة اعتمادها", compare: number, source: {query: contracts.info, path: "partnerDecision[].approvePercentage"}, note_ar: "بإجماع الشركاء = ١٠٠، ثلاثة أرباع = ٧٥"}
    - {id: profit_set_aside_enabled, label_ar: "هل يُجنَّب جزء من الأرباح", prompt_ar: "نسبة الأرباح المجنبة", compare: flag, source: {query: contracts.info, path: setAsideDetails.isSetAsideEnabled}}
    - {id: profit_set_aside_percentage, label_ar: "نسبة الأرباح المجنبة", prompt_ar: "نسبة الأرباح المجنبة", compare: number, source: {query: contracts.info, path: setAsideDetails.profitAllocation.percentage}}
    - {id: profit_set_aside_purpose, label_ar: "الغرض من تجنيب النسبة", prompt_ar: null, compare: text, source: {query: contracts.info, path: setAsideDetails.profitAllocation.purpose}}
    - {id: article_parts, label_ar: "وصف الباب باللغة العربية", prompt_ar: null, compare: list, source: {query: contracts.info, path: "articles[].partName"}, note_ar: "عناوين أبواب العقد"}
    - {id: article_texts, label_ar: "نص البند", prompt_ar: null, compare: text, source: {query: contracts.info, path: "articles[].text"}, note_ar: "لا يُطلب من النموذج نسخ نصوص البنود؛ يُقارن فقط البند الذي يلصقه المستخدم في شاشة المراجعة"}
    - {id: additional_articles, label_ar: "نص البند الإضافي", prompt_ar: null, compare: text, source: {query: contracts.info, path: "additionalArticles[].text"}, note_ar: "عنوان البند في additionalArticles[].title؛ كالبند السابق: يُقارن ما يلصقه المستخدم فقط"}
    - {id: manager_permissions, label_ar: "وصف الصلاحية", prompt_ar: "صلاحية المدير: الاسم", compare: list, source: {query: contracts.manager, path: "[].permissions[].name"}, note_ar: "قبول الرهن، فتح الحسابات، التوقيع على العقود"}
    - {id: permission_can_issue_poa, label_ar: "جواز التوكيل", prompt_ar: "صلاحية المدير: حق التوكيل", compare: flag, source: {query: contracts.manager, path: "[].permissions[].canIssuePOA"}, note_ar: "وله حق توكيل الغير"}
    - {id: permission_can_delegate, label_ar: "جواز الإنابة", prompt_ar: "صلاحية المدير: حق الإنابة", compare: flag, source: {query: contracts.manager, path: "[].permissions[].canDelegate"}}
    - {id: permission_condition, label_ar: "شرط خاص بالصلاحية", prompt_ar: "صلاحية المدير: شرطها", compare: text, source: {query: contracts.manager, path: "[].permissions[].specialConditionText"}}
    - {id: permission_exercise_method, label_ar: "وصف طريقة ممارسة الصلاحية", prompt_ar: "صلاحية المدير: منفرداً أو مجتمعين", compare: text, source: {query: contracts.manager, path: "[].permissions[].exerciseMethodDescription"}, note_ar: "منفرداً / مجتمعين"}
  queries:
    - id: contracts.info
      needs: ["cr_number | unified_number"]
      optional: [copy_number]
      supplies:
        contract_copy_number: contractCopyNumber
        contract_date: contractDate
        unified_number: entity.crNationalNumber
        cr_number: entity.crNumber
        company_name: entity.name
        company_duration: entity.companyDuration
        headquarter_city: entity.headquarterCityName
        is_license_based: entity.isLicenseBased
        license_issuer: entity.licenseIssuerName
        entity_type: entity.entityType.name
        legal_form: entity.entityType.formName
        company_characters: "entity.entityType.characters[].name"
        capital_currency: entity.capital.currencyName
        capital_type: entity.capital.contributionCapital.typeName
        cash_capital: entity.capital.contributionCapital.cashCapital
        in_kind_capital: entity.capital.contributionCapital.inKindCapital
        share_value: entity.capital.contributionCapital.contributionValue
        total_cash_shares: entity.capital.contributionCapital.totalCashContribution
        total_in_kind_shares: entity.capital.contributionCapital.totalInKindContribution
        issued_capital: entity.capital.stockCapital.capital
        announced_capital: entity.capital.stockCapital.announcedCapital
        paid_capital: entity.capital.stockCapital.paidCapital
        stock_count: "entity.capital.stockCapital.stocks[].count"
        stock_value: "entity.capital.stockCapital.stocks[].value"
        stock_types: "entity.capital.stockCapital.stocks[].typeName"
        fiscal_year_calendar: entity.fiscalYear.calendarTypeName
        fiscal_year_end_day: entity.fiscalYear.endDay
        fiscal_year_end_month: entity.fiscalYear.endMonth
        fiscal_year_end_year: entity.fiscalYear.endYear
        partner_names: "entity.parties[].name"
        partner_types: "entity.parties[].typeName"
        partner_ids: "entity.parties[].identity.id"
        partner_id_types: "entity.parties[].identity.typeName"
        partnership_kinds: "entity.parties[].partnership[].name"
        partner_shares: "entity.parties[].partnerShare.totalContributionCount"
        partner_cash_shares: "entity.parties[].partnerShare.cashContributionCount"
        partner_in_kind_shares: "entity.parties[].partnerShare.inKindContributionCount"
        partner_profit_share: "entity.parties[].partnerProfitLossDistribution.profitDistribution"
        partner_loss_share: "entity.parties[].partnerProfitLossDistribution.lossDistribution"
        partner_nationalities: "entity.parties[].nationality.name"
        partner_cr_numbers: "entity.parties[].crNumber"
        partner_license_numbers: "entity.parties[].licenseNo"
        guardian_name: "entity.parties[].guardian.name"
        guardian_id: "entity.parties[].guardian.identity.id"
        guardian_nationality: "entity.parties[].guardian.nationality.name"
        guardian_is_father: "entity.parties[].guardian.isFatherGuardian"
        management_structure: entity.management.structureName
        dismissal_method: entity.management.dismissalMethod
        manager_names: "entity.management.managers[].name"
        manager_types: "entity.management.managers[].typeName"
        manager_ids: "entity.management.managers[].identity.id"
        manager_id_types: "entity.management.managers[].identity.typeName"
        manager_nationalities: "entity.management.managers[].nationality.name"
        manager_positions: "entity.management.managers[].positions[].name"
        board_quorum: entity.management.managementBoard.meetingQuorumName
        board_can_delegate_attendance: entity.management.managementBoard.canDelegateAttendance
        board_term_years: entity.management.managementBoard.termYears
        board_meeting_place: entity.management.managementBoard.meetingPlace
        board_positions: "entity.management.managementBoard.positions[].name"
        directors_board_member_count: entity.management.directorsBoard.memberCount
        directors_board_term_years: entity.management.directorsBoard.termYears
        directors_board_reward: entity.management.directorsBoard.value
        directors_board_reward_max: entity.management.directorsBoard.valueMax
        directors_board_quorum: entity.management.directorsBoard.meetingQuorum
        directors_board_can_delegate_attendance: entity.management.directorsBoard.canDelegateAttendance
        directors_board_meeting_place: entity.management.directorsBoard.meetingPlace
        directors_board_positions: "entity.management.directorsBoard.positions[].name"
        activities: "entity.activities[].name"
        activity_codes: "entity.activities[].id"
        notification_channels: "notificationChannel[].name"
        partner_decisions: "partnerDecision[].name"
        decision_approval_percentages: "partnerDecision[].approvePercentage"
        profit_set_aside_enabled: setAsideDetails.isSetAsideEnabled
        profit_set_aside_percentage: setAsideDetails.profitAllocation.percentage
        profit_set_aside_purpose: setAsideDetails.profitAllocation.purpose
        article_parts: "articles[].partName"
        article_texts: "articles[].text"
        additional_articles: "additionalArticles[].text"
    - id: contracts.management
      needs: ["cr_number | unified_number"]
      note: "the same management block as contracts.info; enough when the document only mentions managers or the board"
      supplies:
        management_structure: structureName
        dismissal_method: dismissalMethod
        manager_names: "managers[].name"
        manager_types: "managers[].typeName"
        manager_ids: "managers[].identity.id"
        manager_id_types: "managers[].identity.typeName"
        manager_nationalities: "managers[].nationality.name"
        manager_positions: "managers[].positions[].name"
        board_quorum: managementBoard.meetingQuorumName
        board_can_delegate_attendance: managementBoard.canDelegateAttendance
        board_term_years: managementBoard.termYears
        board_meeting_place: managementBoard.meetingPlace
        board_positions: "managementBoard.positions[].name"
        directors_board_member_count: directorsBoard.memberCount
        directors_board_term_years: directorsBoard.termYears
        directors_board_reward: directorsBoard.value
        directors_board_reward_max: directorsBoard.valueMax
        directors_board_quorum: directorsBoard.meetingQuorum
        directors_board_can_delegate_attendance: directorsBoard.canDelegateAttendance
        directors_board_meeting_place: directorsBoard.meetingPlace
        directors_board_positions: "directorsBoard.positions[].name"
    - id: contracts.manager
      needs: ["cr_number | unified_number", manager_id, manager_id_type]
      note: "one manager's permissions; permissionId is never sent so every permission comes back"
      supplies:
        manager_names: "[].name"
        manager_types: "[].typeName"
        manager_ids: "[].identity.id"
        manager_id_types: "[].identity.typeName"
        manager_nationalities: "[].nationality.name"
        manager_positions: "[].positions[].name"
        manager_permissions: "[].permissions[].name"
        permission_can_issue_poa: "[].permissions[].canIssuePOA"
        permission_can_delegate: "[].permissions[].canDelegate"
        permission_condition: "[].permissions[].specialConditionText"
        permission_exercise_method: "[].permissions[].exerciseMethodDescription"

# =============================================================================
- id: national_address
  label_ar: "العنوان الوطني للمنشأة"
  label_en: "National address of an establishment"
  about_ar: "سجل البريد السعودي للعنوان الوطني المسجل باسم المنشأة: رقم المبنى والشارع والحي والمدينة والرمز البريدي والرقم الإضافي."
  document_words_ar: "شهادة العنوان الوطني، ترويسة خطاب، فاتورة ضريبية، عقد، عرض سعر، شهادة الزكاة والضريبة، أي مستند يطبع عنوان المنشأة مع رقم سجلها"
  keys:
    - id: cr_number
      label_ar: "رقم السجل التجاري"
      prompt_ar: "رقم السجل التجاري"
      shape: "10 digits starting 1-6; sent as-is (this register accepts the old number directly)"
      personal: false
      required: false
      note_ar: "يكفي أحد الرقمين: رقم السجل التجاري أو الرقم الوطني الموحد"
      aliases_ar: ["رقم السجل التجاري", "س.ت", "سجل تجاري رقم", "C.R. No."]
    - id: unified_number
      label_ar: "الرقم الوطني الموحد"
      prompt_ar: "الرقم الوطني الموحد"
      shape: "10 digits starting 70"
      personal: false
      required: false
      note_ar: "يكفي أحد الرقمين"
      aliases_ar: ["الرقم الوطني الموحد", "الرقم الموحد للمنشأة", "الرقم الموحد", "UNN"]
  facts:
    - {id: establishment_name, label_ar: "اسم المنشأة", prompt_ar: "اسم المنشأة", compare: name, source: {query: national_address.info, path: "[].title"}}
    - {id: building_number, label_ar: "رقم المبنى", prompt_ar: "رقم المبنى", compare: exact, source: {query: national_address.info, path: "[].buildingNumber"}}
    - {id: street, label_ar: "الشارع", prompt_ar: "الشارع", compare: name, source: {query: national_address.info, path: "[].street"}, note_ar: "السجل قد يعيده بالإنجليزية"}
    - {id: district, label_ar: "الحي", prompt_ar: "الحي", compare: name, source: {query: national_address.info, path: "[].district"}}
    - {id: city, label_ar: "المدينة", prompt_ar: "المدينة", compare: name, source: {query: national_address.info, path: "[].city"}}
    - {id: postal_code, label_ar: "الرمز البريدي", prompt_ar: "الرمز البريدي", compare: exact, source: {query: national_address.info, path: "[].postCode"}, note_ar: "٥ أرقام؛ ليس صندوق البريد"}
    - {id: additional_number, label_ar: "الرقم الإضافي", prompt_ar: "الرقم الإضافي", compare: exact, source: {query: national_address.info, path: "[].additionalNumber"}, note_ar: "٤ أرقام بعد الشرطة في سطر العنوان"}
    - {id: unit_number, label_ar: "رقم الوحدة", prompt_ar: "رقم الوحدة", compare: exact, source: {query: national_address.info, path: "[].unitNumber"}}
    - {id: region, label_ar: "المنطقة", prompt_ar: "المنطقة", compare: name, source: {query: national_address.info, path: "[].regionName"}}
    - {id: address_line1, label_ar: "العنوان", prompt_ar: "سطر العنوان", compare: text, source: {query: national_address.info, path: "[].address"}, note_ar: "رقم المبنى، الشارع، الحي"}
    - {id: address_line2, label_ar: "سطر العنوان الثاني (المدينة، الرمز البريدي، الرقم الإضافي)", prompt_ar: "سطر العنوان", compare: text, source: {query: national_address.info, path: "[].address2"}, note_ar: "ليس العنوان المختصر المكوّن من ٤ أحرف و٤ أرقام"}
    - {id: address_status, label_ar: "حالة العنوان", prompt_ar: null, compare: status, source: {query: national_address.info, path: "[].status"}}
    - {id: is_primary_address, label_ar: "العنوان الرئيسي", prompt_ar: null, compare: flag, source: {query: national_address.info, path: "[].isPrimaryAddress"}, note_ar: "يُستخدم لاختيار صف العنوان المناسب حين يعيد السجل أكثر من عنوان"}
  queries:
    - id: national_address.info
      needs: ["cr_number | unified_number"]
      note: "the answer is a list (branches may have their own address): compare against the primary address or the row whose postal code / building number matches"
      supplies:
        establishment_name: "[].title"
        building_number: "[].buildingNumber"
        street: "[].street"
        district: "[].district"
        city: "[].city"
        postal_code: "[].postCode"
        additional_number: "[].additionalNumber"
        unit_number: "[].unitNumber"
        region: "[].regionName"
        address_line1: "[].address"
        address_line2: "[].address2"
        address_status: "[].status"
        is_primary_address: "[].isPrimaryAddress"

# =============================================================================
- id: attorney
  label_ar: "الوكالة الشرعية"
  label_en: "Power of attorney"
  about_ar: "سجل وزارة العدل (ناجز) للوكالات: أطراف الوكالة وحالتها ومدتها وبنودها ونصها."
  document_words_ar: "وكالة، صك وكالة، وكالة إلكترونية، تم إصدار وكالة إلكترونياً رقم، الموكل، الوكيل، وقد تم الإقرار بتوكيل"
  keys:
    - id: attorney_number
      label_ar: "رقم الوكالة"
      prompt_ar: "رقم الوكالة"
      shape: "1-10 digits"
      personal: false
      required: true
      note_ar: "يظهر في ترويسة الصك وداخل نصه بعد «تم إصدار وكالة إلكترونياً رقم»"
      aliases_ar: ["رقم الوكالة", "وكالة رقم", "وكالة إلكترونية رقم", "تم إصدار وكالة إلكترونياً رقم"]
    - id: principal_id
      label_ar: "رقم هوية أحد الموكلين"
      prompt_ar: "رقم هوية الموكل"
      shape: "exactly 10 digits"
      personal: true
      required: false
      note_ar: "يكفي رقم هوية طرف واحد: موكل أو وكيل؛ يُرسل رقم الموكل أولاً ثم رقم الوكيل إن لم يكن الأول طرفاً في الوكالة"
      aliases_ar: ["للموكل", "الموكل", "بموجب إقامة رقم", "بموجب سجل مدني رقم", "بموجب هوية وطنية رقم"]
    - id: agent_id
      label_ar: "رقم هوية أحد الوكلاء"
      prompt_ar: "رقم هوية الوكيل"
      shape: "exactly 10 digits"
      personal: true
      required: false
      note_ar: "بديل عن رقم هوية الموكل؛ يكفي أحدهما"
      aliases_ar: ["الوكيل", "وقد تم الإقرار بتوكيل", "١- … بموجب سجل مدني رقم", "بموجب إقامة رقم"]
  facts:
    - {id: attorney_number, label_ar: "رقم الوكالة", prompt_ar: "رقم الوكالة", compare: exact, source: {query: attorney.info, path: code}, note_ar: "قد يعود باسم attorneyNumber"}
    - {id: attorney_status, label_ar: "حالة الوكالة", prompt_ar: "حالة الوكالة", compare: status, source: {query: attorney.info, path: status}, note_ar: "سارية / منتهية / ملغاة؛ نادراً ما تُطبع في الصك"}
    - {id: issue_date_hijri, label_ar: "تاريخ الإصدار (هجري)", prompt_ar: "تاريخ الإصدار", compare: date, source: {query: attorney.info, path: issueHijriDate}, note_ar: "حرر بتاريخ … هـ"}
    - {id: issue_date_gregorian, label_ar: "تاريخ الإصدار (ميلادي)", prompt_ar: "تاريخ الإصدار", compare: date, source: {query: attorney.info, path: issueGregDate}}
    - {id: expiry_date_hijri, label_ar: "تاريخ الانتهاء (هجري)", prompt_ar: "تاريخ الانتهاء", compare: date, source: {query: attorney.info, path: expiryHijriDate}, note_ar: "سارية حتى / تنتهي بتاريخ"}
    - {id: expiry_date_gregorian, label_ar: "تاريخ الانتهاء (ميلادي)", prompt_ar: "تاريخ الانتهاء", compare: date, source: {query: attorney.info, path: expiryGregDate}, note_ar: "قد يعود باسم expiryDate"}
    - {id: attorney_type, label_ar: "نوع الوكالة", prompt_ar: "نوع الوكالة", compare: text, source: {query: attorney.info, path: attorneyType}, note_ar: "أصلية / فرعية"}
    - {id: issuing_office, label_ar: "اسم جهة الإصدار", prompt_ar: "جهة الإصدار", compare: name, source: {query: attorney.info, path: location.name}, note_ar: "كتابة عدل … / خدمات الوكالات الإلكترونية"}
    - {id: principal_names, label_ar: "اسم الموكل", prompt_ar: "الموكل: الاسم", compare: name, source: {query: attorney.info, path: "principals[].name"}}
    - {id: principal_ids, label_ar: "رقم هوية الموكل", prompt_ar: "الموكل: رقم الهوية", compare: exact, personal: true, source: {query: attorney.info, path: "principals[].id"}}
    - {id: principal_capacities, label_ar: "صفة الموكل", prompt_ar: "الموكل: الصفة", compare: text, source: {query: attorney.info, path: "principals[].SefaName"}, note_ar: "أصالة عن نفسه / بصفته مديراً لشركة / ولياً / وصياً"}
    - {id: agent_names, label_ar: "اسم الوكيل", prompt_ar: "الوكيل: الاسم", compare: list, source: {query: attorney.info, path: "agents[].name"}, note_ar: "القائمة المرقمة بعد «وقد تم الإقرار بتوكيل»"}
    - {id: agent_ids, label_ar: "رقم هوية الوكيل", prompt_ar: "الوكيل: رقم الهوية", compare: exact, personal: true, source: {query: attorney.info, path: "agents[].id"}}
    - {id: agent_capacities, label_ar: "صفة الوكيل", prompt_ar: "الوكيل: الصفة", compare: text, source: {query: attorney.info, path: "agents[].SefaName"}}
    - {id: agents_behavior, label_ar: "طريقة تصرف الوكلاء (عربي)", prompt_ar: "تصرف الوكلاء", compare: text, source: {query: attorney.info, path: agentsBehavior.ar}, note_ar: "مجتمعين / منفردين / مجتمعين أو منفردين"}
    - {id: principal_id_type, label_ar: "نوع الهوية (الموكل)", prompt_ar: null, compare: text, source: {query: attorney.info, path: "AllowedToActOnBehalf[].SocialTypeName"}, note_ar: "إقامة / سجل مدني / هوية وطنية / جواز"}
    - {id: principal_party_type, label_ar: "نوع الطرف", prompt_ar: null, compare: text, source: {query: attorney.info, path: "AllowedToActOnBehalf[].TypeName"}, note_ar: "فردي / شركة / مؤسسة"}
    - {id: principal_cr_number, label_ar: "رقم السجل التجاري (الموكل منشأة)", prompt_ar: "الموكل منشأة: رقم السجل التجاري", compare: exact, source: {query: attorney.info, path: "AllowedToActOnBehalf[].CRNumber"}}
    - {id: principal_national_number, label_ar: "الرقم الوطني (الموكل منشأة)", prompt_ar: "الموكل منشأة: رقم السجل التجاري", compare: exact, personal: true, source: {query: attorney.info, path: "AllowedToActOnBehalf[].NationalNumber"}}
    - {id: company_represent_type, label_ar: "نوع تمثيل المنشأة", prompt_ar: null, compare: text, source: {query: attorney.info, path: "AllowedToActOnBehalf[].CompanyRepresentTypeName"}, note_ar: "بصفته مديراً / مالك المؤسسة / رئيس مجلس الإدارة"}
    - {id: represent_document_type, label_ar: "نوع المستند (سند التمثيل)", prompt_ar: null, compare: text, source: {query: attorney.info, path: "AllowedToActOnBehalf[].DocumentTypeName"}, note_ar: "بموجب عقد التأسيس / قرار الشركاء / السجل التجاري"}
    - {id: decision_number, label_ar: "رقم القرار", prompt_ar: "الموكل منشأة: رقم القرار أو الصك", compare: exact, source: {query: attorney.info, path: "AllowedToActOnBehalf[].KararNumber"}}
    - {id: represent_deed_number, label_ar: "رقم الصك (سند التمثيل)", prompt_ar: "الموكل منشأة: رقم القرار أو الصك", compare: exact, source: {query: attorney.info, path: "AllowedToActOnBehalf[].SakkNumber"}}
    - {id: clauses, label_ar: "نص البند", prompt_ar: null, compare: list, source: {query: attorney.info, path: "textList[].text"}, note_ar: "بنود الصلاحيات في متن الوكالة؛ لا يُطلب نسخها من النموذج، تُعرض من السجل وتُقارن بما يلصقه المستخدم"}
    - {id: clause_categories, label_ar: "تصنيف البند", prompt_ar: "بنود الوكالة", compare: list, source: {query: attorney.info, path: "textList[].type"}, note_ar: "العناوين القصيرة بين أقواس مربعة فقط: [العقارات] [المحاكم] [طلب الخدمات]"}
    - {id: attorney_text, label_ar: "نص الوكالة", prompt_ar: null, compare: text, source: {query: attorney.info, path: text}, note_ar: "متن الصك كاملاً؛ قد يعود باسم attorneyText؛ أرقام الهويات داخله محجوبة؛ لا يُطلب نسخه من النموذج"}
  queries:
    - id: attorney.info
      needs: [attorney_number, "principal_id | agent_id"]
      note: "if the register says the ID is not a party of this attorney, retry once with the other party's ID"
      supplies:
        attorney_number: code
        attorney_status: status
        issue_date_hijri: issueHijriDate
        issue_date_gregorian: issueGregDate
        expiry_date_hijri: expiryHijriDate
        expiry_date_gregorian: expiryGregDate
        attorney_type: attorneyType
        issuing_office: location.name
        principal_names: "principals[].name"
        principal_ids: "principals[].id"
        principal_capacities: "principals[].SefaName"
        agent_names: "agents[].name"
        agent_ids: "agents[].id"
        agent_capacities: "agents[].SefaName"
        agents_behavior: agentsBehavior.ar
        principal_id_type: "AllowedToActOnBehalf[].SocialTypeName"
        principal_party_type: "AllowedToActOnBehalf[].TypeName"
        principal_cr_number: "AllowedToActOnBehalf[].CRNumber"
        principal_national_number: "AllowedToActOnBehalf[].NationalNumber"
        company_represent_type: "AllowedToActOnBehalf[].CompanyRepresentTypeName"
        represent_document_type: "AllowedToActOnBehalf[].DocumentTypeName"
        decision_number: "AllowedToActOnBehalf[].KararNumber"
        represent_deed_number: "AllowedToActOnBehalf[].SakkNumber"
        clauses: "textList[].text"
        clause_categories: "textList[].type"
        attorney_text: text

# =============================================================================
- id: deed
  label_ar: "الصك العقاري"
  label_en: "Real-estate deed"
  about_ar: "سجل وزارة العدل للصكوك العقارية: رقم الصك وتاريخه وجهة إصداره وملاكه وحصصهم ومساحته وحدوده والعقارات التي يشملها."
  document_words_ar: "صك، صك ملكية، صك عقاري، بموجب الصك رقم … وتاريخ …، إفراغ، عقد بيع عقار، عقد إيجار يذكر صكاً، خطاب بنك عقاري"
  keys:
    - id: deed_number
      label_ar: "رقم الصك"
      prompt_ar: "رقم الصك"
      shape: "digits only, 1-20"
      personal: false
      required: true
      note_ar: "لا يكفي وحده؛ يلزم معه رقم هوية أحد الملاك ونوعها"
      aliases_ar: ["رقم الصك", "صك رقم", "الصك رقم", "بموجب الصك رقم"]
    - id: owner_id
      label_ar: "رقم هوية أحد الملاك"
      prompt_ar: "رقم هوية المالك"
      shape: "3-20 letters/digits; national ID 1XXXXXXXXX, iqama 2XXXXXXXXX, passport letters+digits, CR 10 digits"
      personal: true
      required: true
      note_ar: "هوية مالك واحد تكفي لأن السجل يعيد كل الملاك؛ إن ذكر المستند الصك دون هوية مالك يُطلب الرقم في شاشة المراجعة"
      aliases_ar: ["رقم الهوية", "هوية وطنية رقم", "سجل مدني رقم", "بموجب السجل المدني رقم", "رقم الإقامة", "إقامة رقم", "جواز سفر رقم", "رقم السجل التجاري", "س.ت", "رقم صك الوقف", "رقم الترخيص"]
    - id: owner_id_type
      label_ar: "نوع الهوية (المالك)"
      prompt_ar: "نوع هوية المالك"
      shape: "one of National_ID | Resident_ID | Passport | CR_NO | Endowment_Deed_No | license_No | Foreign_CR_No | Gov_National_ID (case-sensitive)"
      personal: false
      required: true
      note_ar: "يُستنتج من كلمة الهوية: هوية وطنية / سجل مدني ← National_ID، إقامة ← Resident_ID، جواز ← Passport، سجل تجاري ← CR_NO، صك وقف ← Endowment_Deed_No، ترخيص ← license_No، جهة حكومية ← Gov_National_ID؛ أو من أول رقم (١ وطنية، ٢ إقامة)"
      aliases_ar: ["هوية وطنية", "سجل مدني", "إقامة", "هوية مقيم", "جواز سفر", "سجل تجاري", "صك وقف", "ترخيص", "جهة حكومية"]
  facts:
    - {id: deed_number, label_ar: "رقم الصك", prompt_ar: "رقم الصك", compare: exact, source: {query: real_estate.deed, path: deedDetails.deedNumber}}
    - {id: deed_serial, label_ar: "الرقم التسلسلي للصك", prompt_ar: "الرقم التسلسلي", compare: exact, source: {query: real_estate.deed, path: deedDetails.deedSerial}, note_ar: "يُطبع على الصك إلى جانب رقمه؛ ليس مفتاحاً ولا بديلاً عن رقم الصك"}
    - {id: deed_date_hijri, label_ar: "تاريخ الصك (هجري)", prompt_ar: "تاريخ الصك", compare: date, source: {query: real_estate.deed, path: deedDetails.deedDate}, note_ar: "السجل هجري فقط؛ تُوحَّد الفواصل والأصفار"}
    - {id: deed_source, label_ar: "مصدر الصك (كتابة العدل / المحكمة)", prompt_ar: "مصدر الصك", compare: text, source: {query: real_estate.deed, path: courtDetails.deedSource}}
    - {id: deed_city, label_ar: "مدينة إصدار الصك", prompt_ar: "مدينة الإصدار", compare: name, source: {query: real_estate.deed, path: courtDetails.deedCity}}
    - {id: deed_status, label_ar: "حالة الصك", prompt_ar: "حالة الصك", compare: status, source: {query: real_estate.deed, path: deedStatus}, note_ar: "القيمة في السجل بالإنجليزية (active)"}
    - {id: deed_area, label_ar: "مساحة الصك (م²)", prompt_ar: "مساحة الصك", compare: number, source: {query: real_estate.deed, path: deedInfo.deedArea}}
    - {id: deed_area_text, label_ar: "مساحة الصك (نصاً)", prompt_ar: "مساحة الصك", compare: text, source: {query: real_estate.deed, path: deedInfo.deedAreaText}}
    - {id: is_mortgaged, label_ar: "هل العقار مرهون", prompt_ar: "مرهون", compare: flag, source: {query: real_estate.deed, path: deedInfo.isRealEstateMortgaged}, note_ar: "مرهون لصالح … / خالٍ من الرهن"}
    - {id: is_halted, label_ar: "هل العقار موقوف عن التصرف", prompt_ar: "موقوف عن التصرف", compare: flag, source: {query: real_estate.deed, path: deedInfo.isRealEstateHalted}}
    - {id: owner_names, label_ar: "اسم المالك", prompt_ar: "المالك: الاسم", compare: name, source: {query: real_estate.deed, path: "ownerDetails[].ownerName"}, note_ar: "يُطابق كل مالك برقم هويته ثم يُقارن اسمه"}
    - {id: owner_ids, label_ar: "رقم هوية المالك", prompt_ar: "المالك: رقم الهوية", compare: exact, personal: true, source: {query: real_estate.deed, path: "ownerDetails[].idNumber"}}
    - {id: owner_id_types, label_ar: "نوع الهوية (المالك)", prompt_ar: null, compare: text, source: {query: real_estate.deed, path: "ownerDetails[].idTypeText"}}
    - {id: owner_birth_dates, label_ar: "تاريخ الميلاد (هجري)", prompt_ar: null, compare: date, personal: true, source: {query: real_estate.deed, path: "ownerDetails[].birthDate"}, note_ar: "يرد في الصكوك القديمة"}
    - {id: owner_nationalities, label_ar: "الجنسية (المالك)", prompt_ar: "المالك: الجنسية", compare: text, source: {query: real_estate.deed, path: "ownerDetails[].nationality"}}
    - {id: owner_shares, label_ar: "حصة الملكية", prompt_ar: "المالك: حصة الملكية", compare: number, source: {query: real_estate.deed, path: "ownerDetails[].owningAmount"}, note_ar: "نسبة مئوية؛ الربع = ٢٥، كامل العقار = ١٠٠"}
    - {id: owner_areas, label_ar: "المساحة المملوكة (م²)", prompt_ar: "المالك: المساحة المملوكة", compare: number, source: {query: real_estate.deed, path: "ownerDetails[].owningArea"}}
    - {id: north_limit, label_ar: "الحد الشمالي", prompt_ar: "حدود الصك: شمالاً", compare: text, source: {query: real_estate.deed, path: deedLimitsDetails.northLimitName}, note_ar: "قطعة / شارع / ممر؛ قيمة البند = الوصف والطول معاً كما طُبعا"}
    - {id: north_limit_description, label_ar: "وصف الحد الشمالي", prompt_ar: "حدود الصك: شمالاً", compare: text, source: {query: real_estate.deed, path: deedLimitsDetails.northLimitDescription}}
    - {id: north_limit_length, label_ar: "طول الحد الشمالي (م)", prompt_ar: "حدود الصك: شمالاً", compare: number, source: {query: real_estate.deed, path: deedLimitsDetails.northLimitLength}}
    - {id: south_limit, label_ar: "الحد الجنوبي", prompt_ar: "حدود الصك: جنوباً", compare: text, source: {query: real_estate.deed, path: deedLimitsDetails.southLimitName}}
    - {id: south_limit_description, label_ar: "وصف الحد الجنوبي", prompt_ar: "حدود الصك: جنوباً", compare: text, source: {query: real_estate.deed, path: deedLimitsDetails.southLimitDescription}}
    - {id: south_limit_length, label_ar: "طول الحد الجنوبي (م)", prompt_ar: "حدود الصك: جنوباً", compare: number, source: {query: real_estate.deed, path: deedLimitsDetails.southLimitLength}}
    - {id: east_limit, label_ar: "الحد الشرقي", prompt_ar: "حدود الصك: شرقاً", compare: text, source: {query: real_estate.deed, path: deedLimitsDetails.eastLimitName}}
    - {id: east_limit_description, label_ar: "وصف الحد الشرقي", prompt_ar: "حدود الصك: شرقاً", compare: text, source: {query: real_estate.deed, path: deedLimitsDetails.eastLimitDescription}}
    - {id: east_limit_length, label_ar: "طول الحد الشرقي (م)", prompt_ar: "حدود الصك: شرقاً", compare: number, source: {query: real_estate.deed, path: deedLimitsDetails.eastLimitLength}}
    - {id: west_limit, label_ar: "الحد الغربي", prompt_ar: "حدود الصك: غرباً", compare: text, source: {query: real_estate.deed, path: deedLimitsDetails.westLimitName}}
    - {id: west_limit_description, label_ar: "وصف الحد الغربي", prompt_ar: "حدود الصك: غرباً", compare: text, source: {query: real_estate.deed, path: deedLimitsDetails.westLimitDescription}}
    - {id: west_limit_length, label_ar: "طول الحد الغربي (م)", prompt_ar: "حدود الصك: غرباً", compare: number, source: {query: real_estate.deed, path: deedLimitsDetails.westLimitLength}}
    - {id: region, label_ar: "المنطقة", prompt_ar: "العقار: المنطقة", compare: name, source: {query: real_estate.deed, path: "realEstateDetails[].regionName"}}
    - {id: city, label_ar: "المدينة", prompt_ar: "العقار: المدينة", compare: name, source: {query: real_estate.deed, path: "realEstateDetails[].cityName"}}
    - {id: district, label_ar: "الحي", prompt_ar: "العقار: الحي", compare: name, source: {query: real_estate.deed, path: "realEstateDetails[].districtName"}}
    - {id: property_type, label_ar: "نوع العقار", prompt_ar: null, compare: text, source: {query: real_estate.deed, path: "realEstateDetails[].realEstateTypeName"}, note_ar: "أرض / شقة / فيلا / عمارة؛ قد يكون فارغاً في السجل"}
    - {id: land_number, label_ar: "رقم القطعة", prompt_ar: "العقار: رقم القطعة", compare: exact, source: {query: real_estate.deed, path: "realEstateDetails[].landNumber"}}
    - {id: plan_number, label_ar: "رقم المخطط", prompt_ar: "العقار: رقم المخطط", compare: exact, source: {query: real_estate.deed, path: "realEstateDetails[].planNumber"}, note_ar: "قد يحوي شرطات مائلة وحروفاً؛ تُقارن بعد حذف المسافات"}
    - {id: property_area, label_ar: "المساحة (م²)", prompt_ar: "العقار: المساحة", compare: number, source: {query: real_estate.deed, path: "realEstateDetails[].area"}}
    - {id: property_area_text, label_ar: "المساحة (نصاً)", prompt_ar: "العقار: المساحة", compare: text, source: {query: real_estate.deed, path: "realEstateDetails[].areaText"}}
    - {id: location_description, label_ar: "وصف الموقع", prompt_ar: null, compare: text, source: {query: real_estate.deed, path: "realEstateDetails[].locationDescription"}}
  queries:
    - id: real_estate.deed
      needs: [deed_number, owner_id, owner_id_type]
      note: "one call per (deed, owner) pair; a not-found answer means the deed and owner together have no match, never which one is wrong"
      supplies:
        deed_number: deedDetails.deedNumber
        deed_serial: deedDetails.deedSerial
        deed_date_hijri: deedDetails.deedDate
        deed_source: courtDetails.deedSource
        deed_city: courtDetails.deedCity
        deed_status: deedStatus
        deed_area: deedInfo.deedArea
        deed_area_text: deedInfo.deedAreaText
        is_mortgaged: deedInfo.isRealEstateMortgaged
        is_halted: deedInfo.isRealEstateHalted
        owner_names: "ownerDetails[].ownerName"
        owner_ids: "ownerDetails[].idNumber"
        owner_id_types: "ownerDetails[].idTypeText"
        owner_birth_dates: "ownerDetails[].birthDate"
        owner_nationalities: "ownerDetails[].nationality"
        owner_shares: "ownerDetails[].owningAmount"
        owner_areas: "ownerDetails[].owningArea"
        north_limit: deedLimitsDetails.northLimitName
        north_limit_description: deedLimitsDetails.northLimitDescription
        north_limit_length: deedLimitsDetails.northLimitLength
        south_limit: deedLimitsDetails.southLimitName
        south_limit_description: deedLimitsDetails.southLimitDescription
        south_limit_length: deedLimitsDetails.southLimitLength
        east_limit: deedLimitsDetails.eastLimitName
        east_limit_description: deedLimitsDetails.eastLimitDescription
        east_limit_length: deedLimitsDetails.eastLimitLength
        west_limit: deedLimitsDetails.westLimitName
        west_limit_description: deedLimitsDetails.westLimitDescription
        west_limit_length: deedLimitsDetails.westLimitLength
        region: "realEstateDetails[].regionName"
        city: "realEstateDetails[].cityName"
        district: "realEstateDetails[].districtName"
        property_type: "realEstateDetails[].realEstateTypeName"
        land_number: "realEstateDetails[].landNumber"
        plan_number: "realEstateDetails[].planNumber"
        property_area: "realEstateDetails[].area"
        property_area_text: "realEstateDetails[].areaText"
        location_description: "realEstateDetails[].locationDescription"

# =============================================================================
- id: employee
  label_ar: "الموظف (المشترك في التأمينات الاجتماعية)"
  label_en: "Employee (GOSI contributor, private sector)"
  about_ar: "سجل التأمينات الاجتماعية للمشترك في القطاع الخاص: اسمه وجنسيته ومدة اشتراكه ومنشآته وحالته فيها وأجره المسجل."
  document_words_ar: "عقد عمل، شهادة تعريف بالراتب، كشف راتب، مشهد مدد الاشتراك من التأمينات، خطاب تعريف، بطاقة هوية، إقامة"
  keys:
    - id: person_id
      label_ar: "رقم الهوية أو رقم الإقامة"
      prompt_ar: "رقم هوية الموظف"
      shape: "exactly 10 digits starting 1 (national ID) or 2 (iqama); passports and GCC IDs are not accepted"
      personal: true
      required: true
      note_ar: "السجل لا يعيد رقم الهوية؛ تتأكد الهوية من الاسم فقط؛ القطاع الخاص وحده"
      aliases_ar: ["رقم الهوية الوطنية", "رقم الهوية", "رقم السجل المدني", "رقم بطاقة الأحوال", "رقم الإقامة", "هوية مقيم", "ID No.", "Iqama No."]
      note_exclude_ar: "«رقم المشترك» في التأمينات ليس رقم الهوية ولا يُرسل"
  facts:
    - {id: employee_name, label_ar: "اسم المشترك الكامل", prompt_ar: "اسم الموظف", compare: name, source: {query: employee.info, path: name}, note_ar: "اسم الموظف / العامل / الطرف الثاني في عقد العمل"}
    - {id: nationality, label_ar: "الجنسية", prompt_ar: "الجنسية", compare: text, source: {query: employee.info, path: nationality}, note_ar: "سعودي = السعودية"}
    - {id: working_months, label_ar: "إجمالي أشهر الاشتراك في التأمينات الاجتماعية", prompt_ar: "أشهر الاشتراك", compare: number, source: {query: employee.info, path: workingMonths}, note_ar: "تراكمي عبر كل المنشآت ويزداد شهرياً؛ السنوات تُحوَّل إلى أشهر"}
    - {id: employer_names, label_ar: "اسم المنشأة", prompt_ar: "اسم المنشأة", compare: name, source: {query: employee.info, path: "employmentInfo[].employer"}, note_ar: "جهة العمل / صاحب العمل / الكفيل / الطرف الأول؛ قائمة بالمنشآت الحالية والسابقة"}
    - {id: employment_status, label_ar: "حالة المشترك في المنشأة", prompt_ar: "حالة الاشتراك", compare: status, source: {query: employee.info, path: "employmentInfo[].status"}, note_ar: "القيم بالإنجليزية: Active (على رأس العمل)، Inactive (منتهي)، Public pension، Private pension (متقاعد)"}
    - {id: basic_wage, label_ar: "الأجر الأساسي الشهري", prompt_ar: "الراتب الأساسي", compare: number, source: {query: employee.info, path: "employmentInfo[].wageDetails.basicWage"}}
    - {id: housing_allowance, label_ar: "بدل السكن الشهري", prompt_ar: "بدل السكن", compare: number, source: {query: employee.info, path: "employmentInfo[].wageDetails.housingAllowance"}, note_ar: "البدل السنوي أو النسبة تُحوَّل إلى قيمة شهرية"}
    - {id: other_allowance, label_ar: "البدلات الأخرى الشهرية", prompt_ar: "البدلات الأخرى", compare: number, source: {query: employee.info, path: "employmentInfo[].wageDetails.otherAllowance"}, note_ar: "مجموع البدلات عدا السكن"}
    - {id: full_wage, label_ar: "إجمالي الأجر", prompt_ar: "إجمالي الراتب", compare: number, source: {query: employee.info, path: "employmentInfo[].wageDetails.fullWage"}, note_ar: "الأجر الخاضع للاشتراك؛ قد يختلف عن إجمالي المستند إن ضم بدلات غير خاضعة"}
  queries:
    - id: employee.info
      needs: [person_id]
      note: "the register never returns date of birth, profession, joining/leaving dates or the establishment's number"
      supplies:
        employee_name: name
        nationality: nationality
        working_months: workingMonths
        employer_names: "employmentInfo[].employer"
        employment_status: "employmentInfo[].status"
        basic_wage: "employmentInfo[].wageDetails.basicWage"
        housing_allowance: "employmentInfo[].wageDetails.housingAllowance"
        other_allowance: "employmentInfo[].wageDetails.otherAllowance"
        full_wage: "employmentInfo[].wageDetails.fullWage"

# =============================================================================
- id: investor
  label_ar: "المستثمر الأجنبي (وزارة الاستثمار)"
  label_en: "Foreign investor (MISA-registered entity)"
  about_ar: "سجل وزارة الاستثمار للكيان الأجنبي المستثمر: بياناته ودولة منشئه وحالة تسجيله وشركاؤه ونسبهم ومفوَّضه."
  document_words_ar: "رخصة استثمار أجنبي، ترخيص استثماري، وزارة الاستثمار، الهيئة العامة للاستثمار، مستثمر أجنبي، فرع شركة أجنبية، شريك أجنبي ونسبة ملكيته"
  keys:
    - id: unified_number
      label_ar: "الرقم الموحد الصادر من سدايا (700)"
      prompt_ar: "الرقم الوطني الموحد"
      shape: "10-12 digits starting 70"
      personal: false
      required: true
      note_ar: "رقم الترخيص الاستثماري ليس مفتاحاً لهذا السجل؛ رقم السجل التجاري القديم (١–٦…) يُحوَّل عبر السجل التجاري أولاً"
      aliases_ar: ["الرقم الوطني الموحد", "الرقم الموحد للمنشأة", "الرقم الموحد", "الرقم الموحد الصادر من سدايا", "رقم المنشأة الموحد"]
  facts:
    - {id: unified_number, label_ar: "الرقم الموحد الصادر من سدايا", prompt_ar: "الرقم الوطني الموحد", compare: exact, source: {query: investor.fullinfo, path: entityInfo.crNationalNumber}}
    - {id: entity_name, label_ar: "أسم المنشأة", prompt_ar: "اسم المنشأة", compare: name, source: {query: investor.fullinfo, path: entityInfo.name}}
    - {id: registration_type, label_ar: "نوع التسجيل", prompt_ar: null, compare: text, source: {query: investor.fullinfo, path: entityInfo.regestrationType}, note_ar: "قد يعود بالإنجليزية"}
    - {id: origin_country, label_ar: "دولة منشأ المنشأة", prompt_ar: "دولة المنشأ", compare: name, source: {query: investor.fullinfo, path: entityInfo.country}, note_ar: "السجل يعيد رمز الدولة (AU) والمستند الاسم (أستراليا)"}
    - {id: origin_cr_number, label_ar: "رقم السجل التجاري في دولة المنشأ", prompt_ar: "رقم السجل في دولة المنشأ", compare: exact, source: {query: investor.fullinfo, path: entityInfo.originCr}}
    - {id: registration_status, label_ar: "وصف حالة التسجيل", prompt_ar: "حالة التسجيل", compare: status, source: {query: investor.fullinfo, path: entityInfo.status.name}, note_ar: "نشط، منتهي، ملغى"}
    - {id: annual_update_date, label_ar: "تاريخ التحديث السنوي القادم", prompt_ar: null, compare: date, source: {query: investor.fullinfo, path: entityInfo.annualUpdateDate}, note_ar: "لا يُساوى بتاريخ انتهاء الرخصة إلا إذا نص المستند"}
    - {id: phone, label_ar: "رقم هاتف المنشأة", prompt_ar: "هاتف المنشأة", compare: exact, source: {query: investor.fullinfo, path: entityInfo.phone}, note_ar: "دون رمز الدولة والصفر البادئ"}
    - {id: email, label_ar: "البريد الإلكتروني الرسمي للمنشأة", prompt_ar: "بريد المنشأة", compare: exact, source: {query: investor.fullinfo, path: entityInfo.email}}
    - {id: partner_names, label_ar: "الاسم الكامل للشريك", prompt_ar: "الشريك: الاسم", compare: list, source: {query: investor.fullinfo, path: "partners[].name"}, note_ar: "قد يعود باسم parties[]"}
    - {id: partner_types, label_ar: "وصف نوع الشريك", prompt_ar: "الشريك: النوع", compare: text, source: {query: investor.fullinfo, path: "partners[].partnersType.name"}, note_ar: "فرد / منظمة"}
    - {id: partner_nationalities, label_ar: "جنسية الشريك", prompt_ar: "الشريك: الجنسية", compare: name, source: {query: investor.fullinfo, path: "partners[].nationality"}, note_ar: "رمز دولة في السجل"}
    - {id: partner_shares, label_ar: "نسبة ملكية الشريك", prompt_ar: "الشريك: نسبة الملكية", compare: number, source: {query: investor.fullinfo, path: "partners[].partnerShare"}, note_ar: "نسبة مئوية (50.000000)؛ إن طُبع عدد الحصص لا النسبة فلا يُقارن"}
    - {id: delegate_name, label_ar: "الاسم الكامل للمفوَّض", prompt_ar: "المفوض: الاسم", compare: name, source: {query: investor.fullinfo, path: delegate.name}, note_ar: "المفوض / الممثل النظامي / المدير العام / مقدم الطلب"}
    - {id: delegate_id_type, label_ar: "وصف نوع هوية المفوَّض", prompt_ar: null, compare: text, source: {query: investor.fullinfo, path: delegate.delegateType.typeName}}
    - {id: delegate_id, label_ar: "رقم هوية المفوض", prompt_ar: "المفوض: رقم الهوية", compare: exact, personal: true, source: {query: investor.fullinfo, path: delegate.delegateType.id}, note_ar: "قد يعود باسم delegate.identity.id"}
    - {id: delegate_nationality, label_ar: "جنسية المفوَّض", prompt_ar: "المفوض: الجنسية", compare: name, source: {query: investor.fullinfo, path: delegate.nationality}, note_ar: "قد يكون فارغاً في السجل"}
    - {id: delegation_start_date, label_ar: "تاريخ بداية التفويض", prompt_ar: "المفوض: بداية التفويض", compare: date, source: {query: investor.fullinfo, path: delegate.delegStartDate}}
    - {id: delegation_end_date, label_ar: "تاريخ انتهاء التفويض", prompt_ar: "المفوض: نهاية التفويض", compare: date, source: {query: investor.fullinfo, path: delegate.delegExpDate}}
  queries:
    - id: investor.fullinfo
      needs: [unified_number]
      note: "the live answer may spell partners as parties, delegateType as identity and delegStartDate/delegExpDate as delegationStartDate/delegationExpDate: read through an alias map"
      supplies:
        unified_number: entityInfo.crNationalNumber
        entity_name: entityInfo.name
        registration_type: entityInfo.regestrationType
        origin_country: entityInfo.country
        origin_cr_number: entityInfo.originCr
        registration_status: entityInfo.status.name
        annual_update_date: entityInfo.annualUpdateDate
        phone: entityInfo.phone
        email: entityInfo.email
        partner_names: "partners[].name"
        partner_types: "partners[].partnersType.name"
        partner_nationalities: "partners[].nationality"
        partner_shares: "partners[].partnerShare"
        delegate_name: delegate.name
        delegate_id_type: delegate.delegateType.typeName
        delegate_id: delegate.delegateType.id
        delegate_nationality: delegate.nationality
        delegation_start_date: delegate.delegStartDate
        delegation_end_date: delegate.delegExpDate

# =============================================================================
- id: drug
  label_ar: "الدواء المسجل لدى هيئة الغذاء والدواء"
  label_en: "Registered drug (SFDA)"
  about_ar: "سجل هيئة الغذاء والدواء للمستحضر الصيدلاني: اسمه التجاري وحالة تسجيله وسعره المعتمد وشهاداته وشروط صرفه."
  document_words_ar: "علبة دواء، نشرة داخلية، شهادة تسجيل مستحضر، قائمة أسعار، فاتورة صيدلية، وصفة طبية، ملاحظة استبدال دواء"
  keys:
    - id: registration_number
      label_ar: "رقم تسجيل المستحضر"
      prompt_ar: "رقم تسجيل المستحضر"
      shape: "digits only, 1-20"
      personal: false
      required: true
      note_ar: "لا بيانات شخصية في هذا السجل"
      aliases_ar: ["رقم التسجيل", "رقم تسجيل المستحضر", "رقم تسجيل الدواء", "رقم التسجيل لدى هيئة الغذاء والدواء", "Registration No.", "SFDA Reg. No."]
  facts:
    - {id: registration_number, label_ar: "رقم تسجيل المستحضر", prompt_ar: "رقم تسجيل المستحضر", compare: exact, source: {query: drug.price, path: registrationNumber}, note_ar: "صدى للمفتاح: يؤكد أن السجل فُتح بالرقم نفسه"}
    - {id: trade_name, label_ar: "الاسم التجاري للمستحضر", prompt_ar: "الاسم التجاري", compare: name, source: {query: drug.status, path: tradeName}, note_ar: "اسم الدواء على العلبة؛ تسامح مع لاحقة التركيز والشكل الصيدلاني"}
    - {id: certificate_status, label_ar: "حالة الشهادة", prompt_ar: "حالة التسجيل", compare: status, source: {query: drug.status, path: certificateStatus}, note_ar: "القيم بالإنجليزية (Registered، Invalid) والمستند بالعربية (مسجل، ملغى)"}
    - {id: certificate_number, label_ar: "رقم الشهادة", prompt_ar: "رقم الشهادة", compare: exact, source: {query: drug.price, path: "certificates[].certificateNumber"}, note_ar: "الأصفار البادئة في السجل"}
    - {id: certificate_start_date, label_ar: "تاريخ بداية الشهادة", prompt_ar: "تاريخ الشهادة", compare: date, source: {query: drug.price, path: "certificates[].startDate"}, note_ar: "الجزء التاريخي فقط"}
    - {id: price, label_ar: "سعر المستحضر", prompt_ar: "السعر", compare: number, source: {query: drug.price, path: "certificates[].price"}, note_ar: "سعر الجمهور / السعر المعتمد؛ يُقارن بأحدث شهادة، ومطابقة شهادة أقدم = مطابقة جزئية"}
    - {id: dispensing_classification, label_ar: "تصنيف الصرف المقترح", prompt_ar: "تصنيف الصرف", compare: text, source: {query: drug.dispensing, path: "certificates[].dispensingClassification"}, note_ar: "يُصرف بوصفة طبية / بدون وصفة (OTC)"}
    - {id: behind_the_counter, label_ar: "صرف خلف المنضدة", prompt_ar: "الصرف خلف المنضدة", compare: text, source: {query: drug.dispensing, path: "certificates[].behindTheCounter"}, note_ar: "يُصرف بواسطة الصيدلي (BTC)"}
    - {id: prescription_type, label_ar: "نوع الوصفة الطبية", prompt_ar: "نوع الوصفة", compare: text, source: {query: drug.dispensing, path: "certificates[].medicalPrescriptionType"}, note_ar: "مخدرة / مراقبة / عادية؛ غالباً فارغ في السجل"}
    - {id: alternative_trade_names, label_ar: "الاسم التجاري للمستحضر البديل", prompt_ar: "اسم البديل", compare: list, source: {query: drug.alternatives, path: "alternatives[].tradeName"}, note_ar: "فقط حين يذكر المستند بديلاً"}
  queries:
    - id: drug.status
      needs: [registration_number]
      supplies: {trade_name: tradeName, certificate_status: certificateStatus}
    - id: drug.price
      needs: [registration_number]
      note: "certificates are a history list: compare with the certificate having the latest start date"
      supplies:
        registration_number: registrationNumber
        certificate_number: "certificates[].certificateNumber"
        price: "certificates[].price"
        certificate_start_date: "certificates[].startDate"
    - id: drug.dispensing
      needs: [registration_number]
      supplies:
        registration_number: registrationNumber
        certificate_status: certificateStatus
        certificate_number: "certificates[].certificateNumber"
        certificate_start_date: "certificates[].startDate"
        dispensing_classification: "certificates[].dispensingClassification"
        behind_the_counter: "certificates[].behindTheCounter"
        prescription_type: "certificates[].medicalPrescriptionType"
    - id: drug.alternatives
      needs: [registration_number]
      note: "only when the document names a substitute product"
      supplies:
        registration_number: registrationNumber
        certificate_number: certificateNumber
        certificate_status: certificateStatus
        price: price
        alternative_trade_names: "alternatives[].tradeName"
