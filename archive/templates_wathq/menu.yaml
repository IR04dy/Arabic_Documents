    - {id: branch_names, label_ar: "الاسم التجاري للمنشأة (الفرع)", prompt_ar: "الفرع: الاسم", compare: list, source: {query: cr.branches, path: "[].name"}}
    - {id: beneficiary_names, label_ar: "اسم المستفيد", prompt_ar: "المستفيد الحقيقي: الاسم", compare: name, source: {query: cr.beneficiary, path: "beneficiaries[].name"}, note_ar: "المستفيد الحقيقي / المالك الفعلي"}
    - {id: beneficiary_types, label_ar: "وصف نوع المستفيد", prompt_ar: null, compare: text, source: {query: cr.beneficiary, path: "beneficiaries[].type.name"}}
    - {id: beneficiary_ids, label_ar: "رقم هوية المستفيد", prompt_ar: "المستفيد الحقيقي: رقم الهوية", compare: exact, personal: true, source: {query: cr.beneficiary, path: "beneficiaries[].identity.id"}}
    - {id: beneficiary_id_types, label_ar: "وصف نوع هوية (المستفيد)", prompt_ar: null, compare: text, source: {query: cr.beneficiary, path: "beneficiaries[].identity.typeName"}}
    - {id: beneficiary_nationalities, label_ar: "وصف جنسية المستفيد", prompt_ar: "المستفيد الحقيقي: الجنسية", compare: text, source: {query: cr.beneficiary, path: "beneficiaries[].nationality.name"}}
    - {id: beneficiary_genders, label_ar: "وصف جنس المستفيد", prompt_ar: null, compare: text, source: {query: cr.beneficiary, path: "beneficiaries[].gender.name"}}
    - {id: beneficiary_reasons, label_ar: "سبب إضافة المستفيد", prompt_ar: "المستفيد الحقيقي: سبب الإضافة", compare: list, source: {query: cr.beneficiary, path: "beneficiaries[].addingReasons[].description"}, note_ar: "ملكية ٢٥٪ فأكثر، سيطرة، تعيين المديرين"}
    - {id: beneficiary_guardian_name, label_ar: "اسم الوصي", prompt_ar: null, compare: name, source: {query: cr.beneficiary, path: "beneficiaries[].guardian.name"}}
    - {id: beneficiary_guardian_id, label_ar: "رقم هوية الوصي", prompt_ar: null, compare: exact, personal: true, source: {query: cr.beneficiary, path: "beneficiaries[].guardian.identity.id"}}
    - {id: beneficiary_guardian_nationality, label_ar: "وصف جنسية الوصي", prompt_ar: null, compare: text, source: {query: cr.beneficiary, path: "beneficiaries[].guardian.nationality.name"}}
    - {id: beneficiary_exemption_reasons, label_ar: "أسباب الإعفاء من الإفصاح عن المستفيد الحقيقي", prompt_ar: null, compare: list, source: {query: cr.beneficiary, path: "exemption.reasons[].description"}}
    - {id: person_name, label_ar: "الاسم (صاحب الهوية)", prompt_ar: null, compare: name, source: {query: cr.related, path: name}, note_ar: "اسم الشخص كما هو مسجل مقابل هويته"}
    - {id: person_id_type_name, label_ar: "وصف نوع الاثبات (صاحب الهوية)", prompt_ar: null, compare: text, source: {query: cr.related, path: identity.typeName}}
    - {id: person_companies, label_ar: "الاسم التجاري للمنشأة (المرتبطة بالهوية)", prompt_ar: null, compare: list, source: {query: cr.related, path: "related[].name"}, note_ar: "لا يطبع مستند «شركات الشخص»؛ خطوة المقارنة تطابق «اسم الشركة» الوارد في المستند مع هذه القائمة"}
    - {id: person_company_unified_numbers, label_ar: "الرقم الموحد للسجل التجاري (المرتبط بالهوية)", prompt_ar: null, compare: list, source: {query: cr.related, path: "related[].crNationalNumber"}, note_ar: "يُطابق مع «الرقم الوطني الموحد» الوارد في المستند"}
    - {id: person_company_status, label_ar: "وصف حالة السجل التجاري (المرتبط)", prompt_ar: null, compare: status, source: {query: cr.related, path: "related[].status.name"}}
    - {id: person_relation, label_ar: "وصف العلاقة", prompt_ar: null, compare: text, source: {query: cr.related, path: "related[].relation.name"}, note_ar: "مالك، شريك، مدير، عضو مجلس؛ يُطابق مع صفة الشخص الملتقطة تحت «الشريك» أو «المدير»"}
    - {id: person_positions, label_ar: "وصف منصب المدير بالمجلس (صاحب الهوية)", prompt_ar: null, compare: list, source: {query: cr.related, path: "related[].positions[].name"}, note_ar: "يُطابق مع «المدير: المنصب»"}
    - {id: person_partnership_kinds, label_ar: "وصف طبيعة الشراكة (صاحب الهوية)", prompt_ar: null, compare: list, source: {query: cr.related, path: "related[].parties[].partnership[].name"}, note_ar: "يُطابق مع «الشريك: صفة الشراكة»"}
    - {id: person_owns_cr, label_ar: "يمتلك سجلاً تجارياً", prompt_ar: null, compare: flag, source: {query: cr.owns, path: ownsCr}, note_ar: "نعم/لا فقط: هل الشخص مالك أو شريك في أي سجل، دون تسمية الشركة"}
  queries:
    - id: cr.cr_national_number
      internal: true
      needs: [cr_number]
      note: "conversion step: old CR -> unified number, cached; a 404 means a struck-off record, then the data query is retried once with the old number"
      supplies: {unified_number: crNationalNumber}
    - id: cr.info
      needs: ["cr_number | unified_number"]
      supplies:
        unified_number: crNationalNumber
        cr_number: crNumber
        company_name: name
        company_duration: companyDuration
        is_main_cr: isMain
        issue_date_gregorian: issueDateGregorian
        issue_date_hijri: issueDateHijri
        main_unified_number: mainCrNationalNumber
        main_cr_number: mainCrNumber
        in_liquidation: inLiquidationProcess
        headquarter_city: headquarterCityName
        entity_type: entityType.name
        legal_form: entityType.formName
        company_characters: "entityType.characters[].name"
        cr_status: status.name
        activity_codes: "activities[].id"
        activities: "activities[].name"
    - id: cr.status
      needs: ["cr_number | unified_number"]
      supplies: {cr_status: name}
    - id: cr.status_dates
      needs: ["cr_number | unified_number"]
      supplies:
        cr_status: name
        confirmation_date_gregorian: confirmationDate.gregorian
        confirmation_date_hijri: confirmationDate.hijri
        suspension_date: suspensionDate.gregorian
        reactivation_date: reactivationDate.gregorian
        deletion_date: deletionDate.gregorian
    - id: cr.capital
      needs: ["cr_number | unified_number"]
      supplies:
        capital: capital
        capital_currency: currencyName
        capital_type: contributionCapital.typeName
        cash_capital: contributionCapital.cashCapital
        in_kind_capital: contributionCapital.inKindCapital
        share_value: contributionCapital.contributionValue
        total_cash_shares: contributionCapital.totalCashContribution
        total_in_kind_shares: contributionCapital.totalInKindContribution
        issued_capital: stockCapital.capital
        announced_capital: stockCapital.announcedCapital
        paid_capital: stockCapital.paidCapital
        stock_count: "stockCapital.stocks[].count"
        stock_value: "stockCapital.stocks[].value"
        stock_types: "stockCapital.stocks[].typeName"
    - id: cr.managers
      needs: ["cr_number | unified_number"]
      supplies:
        manager_names: "[].name"
        manager_types: "[].typeName"
        manager_ids: "[].identity.id"
        manager_id_types: "[].identity.typeName"
        manager_nationalities: "[].nationality.name"
        manager_positions: "[].positions[].name"
    - id: cr.owners
      needs: ["cr_number | unified_number"]
      note: "not offered for joint-stock / simplified joint-stock companies (they have no partners): verdict not_in_register"
      supplies:
        partner_names: "[].name"
        partner_types: "[].typeName"
        partner_ids: "[].identity.id"
        partner_id_types: "[].identity.typeName"
        partnership_kinds: "[].partnership[].name"
        partner_shares: "[].partnerShare.totalContributionCount"
        partner_cash_shares: "[].partnerShare.cashContributionCount"
        partner_in_kind_shares: "[].partnerShare.inKindContributionCount"
        partner_nationalities: "[].nationality.name"
        partner_cr_numbers: "[].crNumber"
        partner_license_numbers: "[].licenseNo"
    - id: cr.branches
      needs: ["cr_number | unified_number"]
      supplies:
        branch_unified_numbers: "[].crNationalNumber"
        branch_cr_numbers: "[].crNumber"
        branch_names: "[].name"
    - id: cr.beneficiary
      needs: ["cr_number | unified_number"]
      supplies:
        beneficiary_names: "beneficiaries[].name"
        beneficiary_types: "beneficiaries[].type.name"
        beneficiary_ids: "beneficiaries[].identity.id"
        beneficiary_id_types: "beneficiaries[].identity.typeName"
        beneficiary_nationalities: "beneficiaries[].nationality.name"
        beneficiary_genders: "beneficiaries[].gender.name"
        beneficiary_reasons: "beneficiaries[].addingReasons[].description"
        beneficiary_guardian_name: "beneficiaries[].guardian.name"
        beneficiary_guardian_id: "beneficiaries[].guardian.identity.id"
        beneficiary_guardian_nationality: "beneficiaries[].guardian.nationality.name"
        beneficiary_exemption_reasons: "exemption.reasons[].description"
    - id: cr.fullinfo
      needs: ["cr_number | unified_number"]
      note: "one call that covers info + status_dates + capital + managers + owners and adds contact, fiscal year, liquidators, licence issuer, management structure"
      supplies:
        unified_number: crNationalNumber
        cr_number: crNumber
        company_name: name
        capital: crCapital
        company_duration: companyDuration
        is_main_cr: isMain
        issue_date_gregorian: issueDateGregorian
        issue_date_hijri: issueDateHijri
        main_unified_number: mainCrNationalNumber
        main_cr_number: mainCrNumber
        in_liquidation: inLiquidationProcess
        headquarter_city: headquarterCityName
        license_issuer: licenseIssuerName
        partners_nationality: PartnersNationalityName
        entity_type: entityType.name
        legal_form: entityType.formName
        company_characters: "entityType.characters[].name"
        cr_status: status.name
        confirmation_date_gregorian: status.confirmationDate.gregorian
        confirmation_date_hijri: status.confirmationDate.hijri
        deletion_date: status.deletionDate.gregorian
        phone: contactInfo.phoneNo
        mobile: contactInfo.mobileNo
        email: contactInfo.email
        website: contactInfo.websiteUrl
        capital_currency: capital.currencyName
        capital_type: capital.contributionCapital.typeName
        cash_capital: capital.contributionCapital.cashCapital
        in_kind_capital: capital.contributionCapital.inKindCapital
        share_value: capital.contributionCapital.contributionValue
        total_cash_shares: capital.contributionCapital.totalCashContribution
        total_in_kind_shares: capital.contributionCapital.totalInKindContribution
        issued_capital: capital.stockCapital.capital
        announced_capital: capital.stockCapital.announcedCapital
        paid_capital: capital.stockCapital.paidCapital
        stock_count: "capital.stockCapital.stocks[].count"
        stock_value: "capital.stockCapital.stocks[].value"
        fiscal_year_calendar: fiscalYear.calendarTypeName
        fiscal_year_end_month: fiscalYear.endMonth
        fiscal_year_end_day: fiscalYear.endDay
        partner_names: "parties[].name"
        partner_types: "parties[].typeName"
        partner_ids: "parties[].identity.id"
        partner_id_types: "parties[].identity.typeName"
        partnership_kinds: "parties[].partnership[].name"
        partner_shares: "parties[].partnerShare.totalContributionCount"
        partner_cash_shares: "parties[].partnerShare.cashContributionCount"
        partner_in_kind_shares: "parties[].partnerShare.inKindContributionCount"
        partner_nationalities: "parties[].nationality.name"
        partner_cr_numbers: "parties[].crNumber"
        partner_license_numbers: "parties[].licenseNo"
        management_structure: management.structureName
        manager_names: "management.managers[].name"
        manager_ids: "management.managers[].identity.id"
        manager_id_types: "management.managers[].identity.typeName"
        manager_nationalities: "management.managers[].nationality.name"
        manager_positions: "management.managers[].positions[].name"
        liquidator_names: "liquidators[].name"
        liquidator_ids: "liquidators[].identity.id"
        activity_codes: "activities[].id"
        activities: "activities[].name"
    - id: cr.related
      needs: [person_id, person_id_type]
      optional: [person_nationality]
      required_if: {person_nationality: {person_id_type: [Passport, Foreign_CR_No]}}
      supplies:
        person_name: name
        person_id_type_name: identity.typeName
        person_company_unified_numbers: "related[].crNationalNumber"
        person_companies: "related[].name"
        person_company_status: "related[].status.name"
        person_relation: "related[].relation.name"
        person_positions: "related[].positions[].name"
        person_partnership_kinds: "related[].parties[].partnership[].name"
    - id: cr.owns
      needs: [person_id, person_id_type]
      optional: [person_nationality]
      required_if: {person_nationality: {person_id_type: [Passport, Foreign_CR_No]}}
      supplies: {person_owns_cr: ownsCr}

# =============================================================================
- id: contract
  label_ar: "عقد تأسيس الشركة / النظام الأساس"
  label_en: "Company contract (articles of association and amendments)"
  about_ar: "نسخة عقد تأسيس الشركة أو نظامها الأساس كما هي مقيدة لدى وزارة التجارة: الشركاء وحصصهم ورأس المال والإدارة والصلاحيات والبنود."
  document_words_ar: "عقد تأسيس، عقد الشركة، النظام الأساس، ملحق تعديل عقد التأسيس، قرار الشركاء، قرار الشريك الوحيد، محضر جمعية، خطاب تفويض مدير"
  keys:
    - id: cr_number
      label_ar: "رقم السجل التجاري"
      prompt_ar: "رقم السجل التجاري"
      shape: "10 digits starting 1-6; converted silently to the unified number first"
      personal: false
      required: false
      note_ar: "يكفي أحد الرقمين: رقم السجل التجاري أو الرقم الوطني الموحد؛ يرد في ديباجة العقد «شركة … سجل تجاري رقم …»"
      aliases_ar: ["رقم السجل التجاري", "سجل تجاري رقم", "س.ت", "رقم السجل"]
    - id: unified_number
      label_ar: "الرقم الوطني الموحد للسجل التجاري"
      prompt_ar: "الرقم الوطني الموحد"
      shape: "10 digits starting 70"
      personal: false
      required: false
      note_ar: "يكفي أحد الرقمين"
      aliases_ar: ["الرقم الوطني الموحد", "الرقم الموحد", "الرقم الوطني الموحد للمنشأة"]
    - id: copy_number
      label_ar: "رقم نسخة العقد"
      prompt_ar: "رقم نسخة العقد"
      shape: "1-5 digits"
      personal: false
      required: false
      note_ar: "اختياري؛ إن لم يذكره المستند يُترك فارغاً فيعود أحدث عقد"
      aliases_ar: ["رقم النسخة", "نسخة العقد رقم", "النسخة المعدلة رقم", "رقم نسخة العقد"]
    - id: manager_id
      label_ar: "رقم هوية المدير"
      prompt_ar: "رقم هوية المدير"
      shape: "3-20 digits; national ID 1XXXXXXXXX, iqama 2XXXXXXXXX"
      personal: true
      required: false
      note_ar: "يلزم فقط حين يذكر المستند صلاحيات مدير بعينه (توكيل، إنابة، منفرداً/مجتمعين)؛ يلزم معه نوع هويته"
      aliases_ar: ["هوية وطنية رقم", "رقم الهوية", "سجل مدني رقم", "إقامة رقم", "جواز سفر رقم", "هوية خليجية رقم"]
    - id: manager_id_type
      label_ar: "نوع الهوية (المدير)"
      prompt_ar: "نوع هوية المدير"
      shape: "one of National_ID | Resident_ID | Passport | GCC_ID | Endowment_Deed_No | License_No | CR_National_ID | Foreign_CR_No | National_Number | Boarder_Number | CR_Number"
      personal: false
      required: false
      note_ar: "يلزم مع رقم هوية المدير؛ يُستنتج من كلمة المستند أو من أول رقم (١ هوية وطنية، ٢ إقامة)"
      aliases_ar: ["هوية وطنية", "سجل مدني", "إقامة", "جواز سفر", "هوية خليجية", "سجل تجاري"]
  facts:
    - {id: contract_copy_number, label_ar: "رقم نسخة العقد", prompt_ar: "رقم النسخة", compare: number, source: {query: contracts.info, path: contractCopyNumber}}
    - {id: contract_date, label_ar: "تاريخ العقد", prompt_ar: "تاريخ العقد", compare: date, source: {query: contracts.info, path: contractDate}, note_ar: "حُرر بتاريخ / تاريخ التأسيس / تاريخ آخر تعديل؛ السجل ميلادي والمستند غالباً هجري"}
    - {id: unified_number, label_ar: "الرقم الموحد للسجل التجاري", prompt_ar: "الرقم الوطني الموحد", compare: exact, source: {query: contracts.info, path: entity.crNationalNumber}}
    - {id: cr_number, label_ar: "رقم السجل التجاري", prompt_ar: "رقم السجل التجاري", compare: exact, source: {query: contracts.info, path: entity.crNumber}}
    - {id: company_name, label_ar: "الاسم التجاري كامل باللغة العربية", prompt_ar: "اسم الشركة", compare: name, source: {query: contracts.info, path: entity.name}, note_ar: "عنوان العقد «عقد تأسيس شركة …»"}
    - {id: company_duration, label_ar: "مدة الشركة", prompt_ar: "مدة الشركة", compare: number, source: {query: contracts.info, path: entity.companyDuration}, note_ar: "بالسنوات؛ قد تُكتب بالحروف"}
    - {id: headquarter_city, label_ar: "وصف مدينة المقر الرئيس للشركة", prompt_ar: "مدينة المقر", compare: name, source: {query: contracts.info, path: entity.headquarterCityName}}
    - {id: is_license_based, label_ar: "هل السجل مصدر بناء على ترخيص", prompt_ar: null, compare: flag, source: {query: contracts.info, path: entity.isLicenseBased}}
    - {id: license_issuer, label_ar: "وصف جهة إصدار الترخيص", prompt_ar: null, compare: text, source: {query: contracts.info, path: entity.licenseIssuerName}}
    - {id: entity_type, label_ar: "وصف نوع الكيان", prompt_ar: "نوع الكيان", compare: text, source: {query: contracts.info, path: entity.entityType.name}}
    - {id: legal_form, label_ar: "وصف شكل الشركة", prompt_ar: "الشكل القانوني", compare: text, source: {query: contracts.info, path: entity.entityType.formName}}
    - {id: company_characters, label_ar: "وصف صفة الشركة", prompt_ar: null, compare: list, source: {query: contracts.info, path: "entity.entityType.characters[].name"}}
    - {id: capital_currency, label_ar: "وصف عملة رأس المال", prompt_ar: null, compare: text, source: {query: contracts.info, path: entity.capital.currencyName}}
    - {id: capital_type, label_ar: "وصف نوع رأس المال", prompt_ar: null, compare: text, source: {query: contracts.info, path: entity.capital.contributionCapital.typeName}}
    - {id: cash_capital, label_ar: "رأس المال النقدي", prompt_ar: "رأس المال: النقدي", compare: number, source: {query: contracts.info, path: entity.capital.contributionCapital.cashCapital}, note_ar: "إجمالي رأس المال للشركة ذات الحصص = النقدي + العيني"}
    - {id: in_kind_capital, label_ar: "رأس المال العيني", prompt_ar: "رأس المال: العيني", compare: number, source: {query: contracts.info, path: entity.capital.contributionCapital.inKindCapital}}
    - {id: share_value, label_ar: "قيمة الحصة", prompt_ar: "رأس المال: قيمة الحصة", compare: number, source: {query: contracts.info, path: entity.capital.contributionCapital.contributionValue}}
    - {id: total_cash_shares, label_ar: "إجمالي عدد الحصص النقدية", prompt_ar: "رأس المال: عدد الحصص", compare: number, source: {query: contracts.info, path: entity.capital.contributionCapital.totalCashContribution}}
    - {id: total_in_kind_shares, label_ar: "إجمالي عدد الحصص العينية", prompt_ar: "رأس المال: عدد الحصص", compare: number, source: {query: contracts.info, path: entity.capital.contributionCapital.totalInKindContribution}}
    - {id: issued_capital, label_ar: "رأس المال المصدر", prompt_ar: "رأس المال: الإجمالي", compare: number, source: {query: contracts.info, path: entity.capital.stockCapital.capital}}
    - {id: announced_capital, label_ar: "رأس المال المصرح به", prompt_ar: null, compare: number, source: {query: contracts.info, path: entity.capital.stockCapital.announcedCapital}}
    - {id: paid_capital, label_ar: "رأس المال المدفوع", prompt_ar: null, compare: number, source: {query: contracts.info, path: entity.capital.stockCapital.paidCapital}}
    - {id: stock_count, label_ar: "عدد الأسهم", prompt_ar: "رأس المال: عدد الأسهم", compare: number, source: {query: contracts.info, path: "entity.capital.stockCapital.stocks[].count"}}
    - {id: stock_value, label_ar: "قيمة السهم", prompt_ar: "رأس المال: قيمة السهم", compare: number, source: {query: contracts.info, path: "entity.capital.stockCapital.stocks[].value"}}
    - {id: stock_types, label_ar: "وصف نوع السهم", prompt_ar: null, compare: list, source: {query: contracts.info, path: "entity.capital.stockCapital.stocks[].typeName"}}
    - {id: fiscal_year_calendar, label_ar: "وصف نوع التقويم (السنة المالية)", prompt_ar: "نهاية السنة المالية", compare: text, source: {query: contracts.info, path: entity.fiscalYear.calendarTypeName}}
    - {id: fiscal_year_end_day, label_ar: "يوم نهاية السنة المالية", prompt_ar: "نهاية السنة المالية", compare: number, source: {query: contracts.info, path: entity.fiscalYear.endDay}}
    - {id: fiscal_year_end_month, label_ar: "شهر نهاية السنة المالية", prompt_ar: "نهاية السنة المالية", compare: number, source: {query: contracts.info, path: entity.fiscalYear.endMonth}}
    - {id: fiscal_year_end_year, label_ar: "سنة نهاية السنة المالية", prompt_ar: "نهاية السنة المالية", compare: number, source: {query: contracts.info, path: entity.fiscalYear.endYear}}
