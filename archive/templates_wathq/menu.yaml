# VERIFICATION MENU — the single source the prompt menu, the review screen and the
# run step are built from.  Grouped by THING (what the document is about), not by endpoint.
#
# Conventions
#   key.required   true = the register cannot be opened without it; false = optional or
#                  one-of/conditional (note_ar says which in plain words).
#   key.shape      what a valid value looks like (digits are folded from Arabic-Indic and
#                  separators stripped by the app before validation).
#   fact.compare   exact | date | name | text | number | status | list | flag
#   fact.source    the primary query and the response path the value is read from;
#                  queries[].supplies maps every fact a query returns to its path there.
#   fact.personal  true = masked to the last four digits before the browser; the exact
#                  comparison must run server-side on the unmasked answer.
#   prompt_ar      the item name as the compact prompt menu (menu_prompt.ar.txt) spells it
#                  and as the LLM must echo it in the checklist ("item").  "X: Y" is a
#                  grouped item (group X, sub-item Y).  Several facts may share one
#                  prompt item (e.g. the Hijri and Gregorian issue dates share
#                  "تاريخ الإصدار"; the twelve boundary facts share "حدود الصك"): the
#                  LLM copies one printed value, the compare step tests it against every
#                  fact behind the item.  A key and a fact with the same prompt_ar are one
#                  checklist entry.  prompt_ar: null = register-only: not asked of the LLM
#                  (to keep the prompt within budget), shown from the register answer and
#                  compared as not_in_document unless the user types a value in review.
#                  The LLM only reports items it found (no "absent" rows); its output schema
#                  restricts "thing" to the thing ids and "item" to that thing's prompt_ar
#                  strings.  Measured with the Qwen3-4B tokenizer (GGUF vocab, no model run)
#                  the prompt menu above the ---- line is 1,496 tokens (517 whitespace-
#                  separated words, first explanatory line included); the question, rules
#                  and JSON shape below it are 641 tokens.  Arabic runs at about 3 tokens
#                  per word, so the "1,000 words" rule of thumb must not be used here.
#   key.derived_from  fact ids whose checklist value doubles as this key (a person's ID is
#                  read from the partner / manager / beneficiary ID lines, never asked as
#                  an item of its own).
#   query.needs    key ids; "a | b" means one of them is enough; query.optional lists keys
#                  that are sent when present; query.required_if names an optional key that
#                  becomes mandatory for given values of another key (catalog required_if):
#                  the run step refuses to send without it.  internal: true = a conversion
#                  step the user never sees (old CR -> unified number).
#   shared keys    cr_number and unified_number are ONE value across things: the review
#                  screen asks once.  A person's ID is NOT shared: the company's partner /
#                  manager and the employee on the same contract are different people.
#   labels         label_ar comes from the Wathq spec descriptions (wathq_view.spec_labels)
#                  or, for specs without descriptions (national address, attorney, deed,
#                  employee), from the catalog's label overrides.  Generic spec labels
#                  ("الاسم", "رقم الإثبات") are qualified by their owning object
#                  (المدير / الشريك / المصفي); a leading "وصف " / "هل " may be dropped
#                  when rendering the prompt.
#   verdicts       matches | partly_matches | differs | not_in_document | not_in_register
#
version: 1
verdicts: [matches, partly_matches, differs, not_in_document, not_in_register]
shared_keys: [cr_number, unified_number]

things:

# =============================================================================
- id: company
  label_ar: "الشركة / المنشأة التجارية (السجل التجاري)"
  label_en: "Company (commercial registration)"
  about_ar: "سجل وزارة التجارة الذي يقيد كل شركة ومؤسسة برقمها واسمها وحالتها ورأس مالها وشركائها ومديريها وأنشطتها."
  document_words_ar: "شهادة سجل تجاري، مستخرج السجل، عقد، فاتورة، ترويسة خطاب، عرض سعر، شهادة شطب، قرار تصفية، نموذج إفصاح عن المستفيد الحقيقي"
  keys:
    - id: cr_number
      label_ar: "رقم السجل التجاري"
      prompt_ar: "رقم السجل التجاري"
      shape: "10 digits starting 1-6 (old CR number); converted silently to the unified number before any query"
      personal: false
      required: false
      note_ar: "يكفي أحد الرقمين: رقم السجل التجاري أو الرقم الوطني الموحد؛ شهادة السجل الحديثة تطبع الاثنين معاً"
      aliases_ar: ["رقم السجل التجاري", "السجل التجاري رقم", "سجل تجاري رقم", "س.ت", "رقم السجل", "C.R. No.", "CR"]
    - id: unified_number
      label_ar: "الرقم الوطني الموحد للسجل التجاري (700)"
      prompt_ar: "الرقم الوطني الموحد"
      shape: "10 digits starting 70"
      personal: false
      required: false
      note_ar: "يكفي أحد الرقمين: الرقم الوطني الموحد أو رقم السجل التجاري"
      aliases_ar: ["الرقم الوطني الموحد", "الرقم الموحد للمنشأة", "الرقم الموحد", "الرقم الوطني الموحد للمنشأة", "National Number", "UNN"]
    - id: person_id
      label_ar: "رقم الهوية / الإثبات"
      prompt_ar: null
      derived_from: [partner_ids, manager_ids, beneficiary_ids]
      shape: "3-20 digits; national ID 1XXXXXXXXX, iqama 2XXXXXXXXX, or an entity number (700…, licence, endowment deed)"
      personal: true
      required: false
      note_ar: "مسار بديل: حين يذكر المستند شخصاً برقم هويته ويصفه مالكاً أو شريكاً أو مديراً في شركة، أو لا يذكر رقم سجل الشركة أصلاً؛ لا يُسأل عنه النموذج بنداً مستقلاً بل يُؤخذ من «الشريك: رقم الهوية» أو «المدير: رقم الهوية» أو «المستفيد الحقيقي: رقم الهوية»؛ يلزم معه نوع الهوية"
      aliases_ar: ["رقم الهوية", "رقم الهوية الوطنية", "هوية وطنية رقم", "سجل مدني رقم", "رقم بطاقة الأحوال", "رقم الإقامة", "إقامة رقم", "هوية مقيم", "جواز سفر رقم", "رقم الحدود", "هوية خليجية", "ID No."]
    - id: person_id_type
      label_ar: "نوع الهوية"
      prompt_ar: null
      derived_from: [partner_ids, manager_ids, beneficiary_ids]
      shape: "one of National_ID | Resident_ID | Passport | GCC_ID | Endowment_Deed_No | License_No | CR_National_ID | Foreign_CR_No | National_Number | Boarder_Number"
      personal: false
      required: false
      note_ar: "يلزم مع رقم الهوية؛ لا يُطبع كحقل بل يُستنتج من الكلمة المرافقة لرقم الهوية في موضع («where») السطر الذي أُخذ منه الرقم (هوية وطنية / سجل مدني ← National_ID، إقامة ← Resident_ID، جواز سفر ← Passport، هوية خليجية ← GCC_ID، رقم الحدود ← Boarder_Number) أو من أول رقم: ١ هوية وطنية، ٢ إقامة"
      aliases_ar: ["هوية وطنية", "سجل مدني", "بطاقة أحوال", "إقامة", "هوية مقيم", "جواز سفر", "هوية خليجية", "رقم حدود", "صك وقف", "ترخيص"]
    - id: person_nationality
      label_ar: "الجنسية"
      prompt_ar: null
      shape: "nationality name as printed; the app converts it to the numeric NIC code"
      personal: false
      required: false
      note_ar: "تلزم فقط حين تكون الهوية جواز سفر أو سجلاً تجارياً أجنبياً"
      aliases_ar: ["الجنسية", "سعودي الجنسية", "مصري الجنسية", "Nationality"]
  facts:
    - {id: unified_number, label_ar: "الرقم الموحد للسجل التجاري", prompt_ar: "الرقم الوطني الموحد", compare: exact, source: {query: cr.info, path: crNationalNumber}}
    - {id: cr_number, label_ar: "رقم السجل التجاري", prompt_ar: "رقم السجل التجاري", compare: exact, source: {query: cr.info, path: crNumber}}
    - {id: company_name, label_ar: "الاسم التجاري للمنشأة", prompt_ar: "اسم الشركة", compare: name, source: {query: cr.info, path: name}}
    - {id: entity_type, label_ar: "وصف نوع الكيان", prompt_ar: "نوع الكيان", compare: text, source: {query: cr.info, path: entityType.name}, note_ar: "شركة أو مؤسسة"}
    - {id: legal_form, label_ar: "وصف شكل الشركة", prompt_ar: "الشكل القانوني", compare: text, source: {query: cr.info, path: entityType.formName}, note_ar: "ذات مسؤولية محدودة، مساهمة، مساهمة مبسطة، تضامن، توصية بسيطة"}
    - {id: company_characters, label_ar: "وصف صفة الشركة", prompt_ar: null, compare: list, source: {query: cr.info, path: "entityType.characters[].name"}, note_ar: "شخص واحد، مهنية، غير ربحية، عائلية"}
    - {id: cr_status, label_ar: "وصف حالة السجل التجاري", prompt_ar: "حالة السجل", compare: status, source: {query: cr.status, path: name}, note_ar: "فعال، معلق، مشطوب، منتهي"}
    - {id: issue_date_gregorian, label_ar: "تاريخ اصدار السجل التجاري ميلادي", prompt_ar: "تاريخ الإصدار", compare: date, source: {query: cr.info, path: issueDateGregorian}}
    - {id: issue_date_hijri, label_ar: "تاريخ اصدار السجل التجاري هجري", prompt_ar: "تاريخ الإصدار", compare: date, source: {query: cr.info, path: issueDateHijri}}
    - {id: confirmation_date_gregorian, label_ar: "تاريخ التأكيد السنوي (ميلادي)", prompt_ar: "تاريخ التأكيد السنوي", compare: date, source: {query: cr.status_dates, path: confirmationDate.gregorian}, note_ar: "آخر تأكيد / تجديد؛ ليس «تاريخ انتهاء السجل» المطبوع على الشهادات القديمة (السجل لا يعيده، فلا يُقارن به)"}
    - {id: confirmation_date_hijri, label_ar: "تاريخ التأكيد السنوي (هجري)", prompt_ar: "تاريخ التأكيد السنوي", compare: date, source: {query: cr.status_dates, path: confirmationDate.hijri}}
    - {id: suspension_date, label_ar: "تاريخ التعليق (ميلادي)", prompt_ar: null, compare: date, source: {query: cr.status_dates, path: suspensionDate.gregorian}}
    - {id: reactivation_date, label_ar: "تاريخ رفع التعليق (ميلادي)", prompt_ar: null, compare: date, source: {query: cr.status_dates, path: reactivationDate.gregorian}}
    - {id: deletion_date, label_ar: "تاريخ الشطب (ميلادي)", prompt_ar: null, compare: date, source: {query: cr.status_dates, path: deletionDate.gregorian}}
    - {id: company_duration, label_ar: "مدة الشركة", prompt_ar: "مدة الشركة", compare: number, source: {query: cr.info, path: companyDuration}, note_ar: "بالسنوات؛ قد تُكتب بالحروف"}
    - {id: is_main_cr, label_ar: "هل السجل التجاري رئيسي", prompt_ar: "رئيسي أم فرع", compare: flag, source: {query: cr.info, path: isMain}, note_ar: "رئيسي أو فرع"}
    - {id: main_cr_number, label_ar: "رقم السجل التجاري الرئيسي", prompt_ar: "رئيسي أم فرع", compare: exact, source: {query: cr.info, path: mainCrNumber}, note_ar: "على شهادة الفرع"}
    - {id: main_unified_number, label_ar: "الرقم الموحد للسجل الرئيسي", prompt_ar: "رئيسي أم فرع", compare: exact, source: {query: cr.info, path: mainCrNationalNumber}}
    - {id: in_liquidation, label_ar: "هل الشركة جاري تصفيتها", prompt_ar: "حالة السجل", compare: flag, source: {query: cr.info, path: inLiquidationProcess}}
    - {id: headquarter_city, label_ar: "وصف مدينة المقر الرئيسي للشركة", prompt_ar: "مدينة المقر", compare: name, source: {query: cr.info, path: headquarterCityName}}
    - {id: activities, label_ar: "وصف النشاط التجاري", prompt_ar: "الأنشطة", compare: list, source: {query: cr.info, path: "activities[].name"}, note_ar: "الأنشطة / أغراض الشركة؛ المستند قد يصوغها بغير النص الرسمي"}
    - {id: activity_codes, label_ar: "رمز النشاط التجاري", prompt_ar: "الأنشطة", compare: list, source: {query: cr.info, path: "activities[].id"}, note_ar: "رمز ISIC"}
    - {id: capital, label_ar: "رأس المال", prompt_ar: "رأس المال: الإجمالي", compare: number, source: {query: cr.capital, path: capital}}
    - {id: capital_currency, label_ar: "وصف عملة رأس المال", prompt_ar: null, compare: text, source: {query: cr.capital, path: currencyName}}
    - {id: capital_type, label_ar: "وصف نوع رأس المال", prompt_ar: null, compare: text, source: {query: cr.capital, path: contributionCapital.typeName}, note_ar: "نقدي / عيني / نقدي وعيني"}
    - {id: cash_capital, label_ar: "رأس المال النقدي", prompt_ar: "رأس المال: النقدي", compare: number, source: {query: cr.capital, path: contributionCapital.cashCapital}}
    - {id: in_kind_capital, label_ar: "رأس المال العيني", prompt_ar: "رأس المال: العيني", compare: number, source: {query: cr.capital, path: contributionCapital.inKindCapital}}
    - {id: share_value, label_ar: "قيمة الحصة", prompt_ar: "رأس المال: قيمة الحصة", compare: number, source: {query: cr.capital, path: contributionCapital.contributionValue}}
    - {id: total_cash_shares, label_ar: "إجمالي عدد الحصص النقدية", prompt_ar: "رأس المال: عدد الحصص", compare: number, source: {query: cr.capital, path: contributionCapital.totalCashContribution}}
    - {id: total_in_kind_shares, label_ar: "إجمالي عدد الحصص العينية", prompt_ar: "رأس المال: عدد الحصص", compare: number, source: {query: cr.capital, path: contributionCapital.totalInKindContribution}}
    - {id: issued_capital, label_ar: "راس المال المصدر", prompt_ar: "رأس المال: الإجمالي", compare: number, source: {query: cr.capital, path: stockCapital.capital}, note_ar: "شركات المساهمة"}
    - {id: announced_capital, label_ar: "رأس المال المصرح به", prompt_ar: null, compare: number, source: {query: cr.capital, path: stockCapital.announcedCapital}}
    - {id: paid_capital, label_ar: "رأس المال المدفوع", prompt_ar: null, compare: number, source: {query: cr.capital, path: stockCapital.paidCapital}}
    - {id: stock_count, label_ar: "عدد الأسهم", prompt_ar: "رأس المال: عدد الأسهم", compare: number, source: {query: cr.capital, path: "stockCapital.stocks[].count"}}
    - {id: stock_value, label_ar: "قيمة السهم", prompt_ar: "رأس المال: قيمة السهم", compare: number, source: {query: cr.capital, path: "stockCapital.stocks[].value"}}
    - {id: stock_types, label_ar: "وصف نوع السهم", prompt_ar: null, compare: list, source: {query: cr.capital, path: "stockCapital.stocks[].typeName"}}
    - {id: partner_names, label_ar: "اسم الشريك / المالك", prompt_ar: "الشريك: الاسم", compare: name, source: {query: cr.owners, path: "[].name"}, note_ar: "قائمة؛ يُطابق كل شريك باسمه أو هويته"}
    - {id: partner_types, label_ar: "وصف نوع الشريك", prompt_ar: null, compare: text, source: {query: cr.owners, path: "[].typeName"}, note_ar: "فرد سعودي، شركة، مستثمر أجنبي، جمعية"}
    - {id: partner_ids, label_ar: "رقم الإثبات (الشريك)", prompt_ar: "الشريك: رقم الهوية", compare: exact, personal: true, source: {query: cr.owners, path: "[].identity.id"}}
    - {id: partner_id_types, label_ar: "وصف نوع الاثبات (الشريك)", prompt_ar: null, compare: text, source: {query: cr.owners, path: "[].identity.typeName"}}
    - {id: partnership_kinds, label_ar: "وصف طبيعة الشراكة", prompt_ar: "الشريك: صفة الشراكة", compare: list, source: {query: cr.owners, path: "[].partnership[].name"}, note_ar: "شريك برأس المال، مؤسس، متضامن، موصٍ"}
    - {id: partner_shares, label_ar: "إجمالي عدد حصص الشريك", prompt_ar: "الشريك: الحصص أو النسبة", compare: number, source: {query: cr.owners, path: "[].partnerShare.totalContributionCount"}, note_ar: "عدد حصص لا نسبة؛ النسبة = حصص الشريك ÷ إجمالي الحصص، والمبلغ = الحصص × قيمة الحصة"}
    - {id: partner_cash_shares, label_ar: "عدد الحصص النقدية (الشريك)", prompt_ar: "الشريك: الحصص أو النسبة", compare: number, source: {query: cr.owners, path: "[].partnerShare.cashContributionCount"}}
    - {id: partner_in_kind_shares, label_ar: "عدد الحصص العينية (الشريك)", prompt_ar: "الشريك: الحصص أو النسبة", compare: number, source: {query: cr.owners, path: "[].partnerShare.inKindContributionCount"}}
    - {id: partner_nationalities, label_ar: "وصف الجنسية (الشريك)", prompt_ar: "الشريك: الجنسية", compare: text, source: {query: cr.owners, path: "[].nationality.name"}}
    - {id: partner_cr_numbers, label_ar: "رقم السجل التجاري (الشريك الاعتباري)", prompt_ar: "الشريك: رقم سجله", compare: exact, source: {query: cr.owners, path: "[].crNumber"}}
    - {id: partner_license_numbers, label_ar: "رقم الترخيص (الشريك)", prompt_ar: null, compare: exact, source: {query: cr.owners, path: "[].licenseNo"}}
    - {id: manager_names, label_ar: "اسم المدير", prompt_ar: "المدير: الاسم", compare: name, source: {query: cr.managers, path: "[].name"}, note_ar: "المدير العام، المفوض بالتوقيع، عضو مجلس الإدارة"}
    - {id: manager_types, label_ar: "وصف نوع المدير", prompt_ar: null, compare: text, source: {query: cr.managers, path: "[].typeName"}}
    - {id: manager_ids, label_ar: "رقم الإثبات (المدير)", prompt_ar: "المدير: رقم الهوية", compare: exact, personal: true, source: {query: cr.managers, path: "[].identity.id"}}
    - {id: manager_id_types, label_ar: "وصف نوع الاثبات (المدير)", prompt_ar: null, compare: text, source: {query: cr.managers, path: "[].identity.typeName"}}
    - {id: manager_nationalities, label_ar: "وصف الجنسية (المدير)", prompt_ar: "المدير: الجنسية", compare: text, source: {query: cr.managers, path: "[].nationality.name"}}
    - {id: manager_positions, label_ar: "وصف منصب المدير بالمجلس", prompt_ar: "المدير: المنصب", compare: list, source: {query: cr.managers, path: "[].positions[].name"}, note_ar: "مدير عام، رئيس مجلس المديرين، عضو"}
    - {id: management_structure, label_ar: "وصف الهيكل الإداري", prompt_ar: null, compare: text, source: {query: cr.fullinfo, path: management.structureName}, note_ar: "مدير / مجلس مديرين / مجلس إدارة"}
    - {id: license_issuer, label_ar: "وصف جهة إصدار الترخيص", prompt_ar: null, compare: text, source: {query: cr.fullinfo, path: licenseIssuerName}}
    - {id: partners_nationality, label_ar: "وصف جنسية الشركاء", prompt_ar: "الشريك: الجنسية", compare: text, source: {query: cr.fullinfo, path: PartnersNationalityName}, note_ar: "سعودية، مختلطة، أجنبية"}
